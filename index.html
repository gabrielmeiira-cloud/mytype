    <script>
        const bottomSheet = document.getElementById('bottomSheet');
        const sheetHeader = document.getElementById('sheetHeader');
        const sheetContent = document.getElementById('sheetContent');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetHandle = document.getElementById('sheetHandle');
        const appContainer = document.getElementById('appContainer');
        const phoneMovableFrame = document.getElementById('phoneMovableFrame');
        const sideMenu = document.getElementById('sideMenu');
        const windowDragHandle = document.getElementById('windowDragHandle');
        const btnMinimize = document.getElementById('btnMinimize');
        const floatingBubble = document.getElementById('floatingBubble');
        const viewportCanvas = document.getElementById('viewportCanvas');
        const avatarContainer = document.getElementById('avatarContainer');
        const zoomLevelText = document.getElementById('zoomLevelText');
        const coordsText = document.getElementById('coordsText');
        const bgModeLabel = document.getElementById('bgModeLabel');
        const infiniteBackdrop = document.getElementById('infiniteBackdrop');

        /* --- CONTROLE DE MODO DE DEGRADÊ (ANTIGO FIXO VS NOVO CÂMERA) --- */
        let isCameraBg = true; // Padrão: Câmera (Novo)

        function toggleBackgroundMode() {
            isCameraBg = !isCameraBg;
            if (isCameraBg) {
                viewportCanvas.classList.remove('mode-static-bg');
                if (infiniteBackdrop) {
                    infiniteBackdrop.style.opacity = '1';
                    infiniteBackdrop.style.visibility = 'visible';
                }
                bgModeLabel.innerText = "Fundo: Câmera (Novo)";
            } else {
                viewportCanvas.classList.add('mode-static-bg');
                if (infiniteBackdrop) {
                    infiniteBackdrop.style.opacity = '0';
                    infiniteBackdrop.style.visibility = 'hidden';
                }
                bgModeLabel.innerText = "Fundo: Fixo (Antigo)";
            }
        }

        /* --- MOTOR DE CÂMERA RESPONSIVO (PROPORÇÃO NORMALIZADA DE CORPO) --- */
        const DEFAULT_SCALE = 0.79;
        const MIN_SCALE = 0.55;
        const MAX_SCALE = 4.0;

        let avatarScale = DEFAULT_SCALE;
        let avatarPanX = 0;
        let avatarPanY = 0;
        let isCameraAnimating = false;
        let activeSessionName = "Identidade";

        function getAvatarLayoutMetrics() {
            const w = viewportCanvas ? viewportCanvas.clientWidth : 350;
            const h = viewportCanvas ? viewportCanvas.clientHeight : 600;
            const imgAspect = 9 / 16;
            const containerAspect = w / h;

            let renderedW, renderedH, offsetX, offsetY;

            if (containerAspect < imgAspect) {
                renderedW = w;
                renderedH = w / imgAspect;
                offsetX = 0;
                offsetY = h - renderedH;
            } else {
                renderedH = h;
                renderedW = h * imgAspect;
                offsetX = (w - renderedW) / 2;
                offsetY = 0;
            }

            return { w, h, renderedW, renderedH, offsetX, offsetY };
        }

        /* --- MOTOR DE CÂMERA DE ALTA FIDELIDADE (POSIÇÃO EXATA + ÂNCORA INTELIGENTE) --- */
        // Grava a posição EXATA onde o usuário posicionou na tela sem alterar ou desviar
        const sessionCameraPresets = {
            "Identidade": { scale: 0.79, panX: 0, panY: 0, anchorV: "center", anchorH: "center" },
            "Aparência":  { scale: 2.85, panX: 0, panY: 480, anchorV: "top", anchorH: "center" },
            "Busto":      { scale: 3.53, panX: 0, panY: 260, anchorV: "center", anchorH: "center" },
            "Pernas":     { scale: 1.65, panX: 0, panY: -210, anchorV: "center", anchorH: "center" },
            "Pés":        { scale: 2.65, panX: 0, panY: -780, anchorV: "bottom", anchorH: "center" },
            "Estilo":     { scale: 1.12, panX: 0, panY: 15, anchorV: "center", anchorH: "center" },
            "Gravação":   { scale: 0.92, panX: 0, panY: 0, anchorV: "center", anchorH: "center" }
        };

        try {
            const saved = localStorage.getItem('mytype_camera_presets_v5');
            if (saved) {
                Object.assign(sessionCameraPresets, JSON.parse(saved));
            }
        } catch(e) {}

        const btnDebugMode = document.getElementById('btnDebugMode');
        const cameraHudGroup = document.getElementById('cameraHudGroup');
        const activeSessionTitle = document.getElementById('activeSessionTitle');
        const liveCameraStatus = document.getElementById('liveCameraStatus');
        let isDebugMode = false;

        function toggleDebugMode(e) {
            if (e) e.stopPropagation();
            isDebugMode = !isDebugMode;
            
            // Desativa as alças de redimensionamento da janela do OS durante a depuração para não conflitar
            const resizeHandles = document.querySelectorAll('.win-resize-handle');
            resizeHandles.forEach(h => {
                h.style.display = isDebugMode ? 'none' : '';
            });

            if (isDebugMode) {
                if (btnDebugMode) btnDebugMode.classList.add('active');
                if (cameraHudGroup) cameraHudGroup.classList.add('debug-visible');
                updateCameraHudDOM();
            } else {
                if (btnDebugMode) btnDebugMode.classList.remove('active');
                if (cameraHudGroup) cameraHudGroup.classList.remove('debug-visible');
            }
        }

        /* --- GERENCIADOR DE STATUS DE SINCRONIZAÇÃO (ONLINE / OFFLINE / ENVIANDO) --- */
        function setConnectionStatus(state, message) {
            const badge = document.getElementById('serverStatusBadge');
            const txt = document.getElementById('serverStatusText');
            if (!badge || !txt) return;

            badge.classList.remove('sending', 'error');
            if (state === 'sending') {
                badge.classList.add('sending');
            } else if (state === 'error') {
                badge.classList.add('error');
            }
            txt.innerText = message;
        }

        /* --- INTEGRAÇÃO EM TEMPO REAL COM O GOOGLE FIREBASE FIRESTORE --- */
        const firebaseConfig = {
            apiKey: "AIzaSyA1aoL7vtEiqpal0KwGbXp9V442aMLW5eA",
            authDomain: "meutipodata.firebaseapp.com",
            projectId: "meutipodata",
            storageBucket: "meutipodata.firebasestorage.app",
            messagingSenderId: "506962069843",
            appId: "1:506962069843:web:685913c26130904b3d39a6"
        };

        let db = null;
        let presetsDoc = null;

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                presetsDoc = db.collection('app_settings').doc('camera_presets');
                
                // Escuta alterações em tempo real via WebSockets (onSnapshot)
                presetsDoc.onSnapshot((doc) => {
                    if (doc.exists) {
                        const remotePresets = doc.data();
                        console.log("🔥 [Firebase] Presets recebidos em tempo real:", remotePresets);
                        setConnectionStatus("online", "🟢 Firebase: Online & Sincronizado");
                        Object.assign(sessionCameraPresets, remotePresets);
                        try {
                            localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
                        } catch(e) {}
                        if (activeSessionName) {
                            applySessionCameraPreset(activeSessionName, 350);
                        }
                        updateCameraHudDOM();
                    } else {
                        // Inicializa o documento no Firestore se ainda não existir
                        presetsDoc.set(sessionCameraPresets);
                    }
                }, (err) => {
                    console.warn("Firebase onSnapshot warning:", err.message);
                    setConnectionStatus("error", "🔴 Firebase: Offline (" + (err.code || "erro") + ")");
                });
            }
        } catch(e) {
            console.warn("Firebase initialization error:", e);
        }

        async function syncPresetToCloud(sessionName, presetData) {
            setConnectionStatus("sending", "🟡 Gravando...");

            // Atualiza o localStorage local imediatamente para resposta instantânea
            try {
                localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
            } catch(e) {}

            let firestoreSuccess = false;
            if (presetsDoc) {
                try {
                    const savePromise = presetsDoc.set({ [sessionName]: presetData }, { merge: true });
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Firestore pendente (ative o banco nas regras)")), 3000));
                    await Promise.race([savePromise, timeoutPromise]);
                    firestoreSuccess = true;
                    console.log(`🔥 [Firebase] Posição "${sessionName}" salva e replicada!`);
                    setConnectionStatus("online", "🟢 Gravado no Firebase: " + sessionName);
                } catch(e) {
                    console.warn("Erro ao salvar no Firestore:", e);
                    const isPerm = e.message && (e.message.includes("permission") || e.message.includes("PERMISSION_DENIED"));
                    setConnectionStatus("error", isPerm ? "🔴 Regras do Firestore Bloqueadas" : "🔴 " + e.message);
                }
            }

            if (!firestoreSuccess) {
                try {
                    await fetch('/api/presets', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [sessionName]: presetData })
                    });
                } catch(e) {}
            }
        }

        function setSessionAnchorV(anchor) {
            if (!sessionCameraPresets[activeSessionName]) {
                sessionCameraPresets[activeSessionName] = { scale: avatarScale, panX: avatarPanX, panY: avatarPanY };
            }
            sessionCameraPresets[activeSessionName].anchorV = anchor;
            
            // Ajusta o Pan Y respeitando a âncora
            const m = getAvatarLayoutMetrics();
            const sheetH = bottomSheet ? bottomSheet.clientHeight : getInitialHeight();
            const visibleH = Math.max(120, m.h - sheetH);

            if (anchor === 'top') {
                const desiredTop = 18;
                const naturalTopPt = m.offsetY;
                const unpannedTop = (naturalTopPt - (m.h / 2)) * avatarScale + (m.h / 2);
                avatarPanY = Math.round(desiredTop - unpannedTop);
            } else if (anchor === 'bottom') {
                const desiredBottom = visibleH - 14;
                const naturalBottomPt = m.offsetY + m.renderedH;
                const unpannedBottom = (naturalBottomPt - (m.h / 2)) * avatarScale + (m.h / 2);
                avatarPanY = Math.round(desiredBottom - unpannedBottom);
            }

            const clamped = clampPan(avatarPanX, avatarPanY, avatarScale);
            avatarPanX = clamped.x;
            avatarPanY = clamped.y;
            sessionCameraPresets[activeSessionName].panX = avatarPanX;
            sessionCameraPresets[activeSessionName].panY = avatarPanY;

            try {
                localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
            } catch(e) {}
            syncPresetToCloud(activeSessionName, sessionCameraPresets[activeSessionName]);

            updateAvatarTransform(true);
            updateCameraHudDOM();
        }

        function setSessionAnchorH(anchor) {
            if (!sessionCameraPresets[activeSessionName]) {
                sessionCameraPresets[activeSessionName] = { scale: avatarScale, panX: avatarPanX, panY: avatarPanY };
            }
            sessionCameraPresets[activeSessionName].anchorH = anchor;
            if (anchor === 'center') {
                avatarPanX = 0;
            }
            sessionCameraPresets[activeSessionName].panX = avatarPanX;

            try {
                localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
            } catch(e) {}
            syncPresetToCloud(activeSessionName, sessionCameraPresets[activeSessionName]);

            updateAvatarTransform(true);
            updateCameraHudDOM();
        }

        function updateCameraHudDOM() {
            if (activeSessionTitle) {
                activeSessionTitle.innerText = `🎯 Sessão: ${activeSessionName}`;
            }
            const preset = sessionCameraPresets[activeSessionName] || { scale: avatarScale, panX: avatarPanX, panY: avatarPanY, anchorV: 'center', anchorH: 'center' };
            if (liveCameraStatus) {
                const aV = preset.anchorV || 'center';
                const aH = preset.anchorH || 'center';
                liveCameraStatus.innerText = `🔍 Zoom: ${Math.round(avatarScale * 100)}% | ↔️ X: ${Math.round(avatarPanX)} | ↕️ Y: ${Math.round(avatarPanY)} | ⚓ ${aV.toUpperCase()}`;
            }
            document.querySelectorAll('[data-camera-tab]').forEach(tag => {
                if (tag.getAttribute('data-camera-tab') === activeSessionName) {
                    tag.classList.add('active');
                } else {
                    tag.classList.remove('active');
                }
            });

            // Atualiza botões de âncora
            document.querySelectorAll('[data-anchor-v]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-anchor-v') === (preset.anchorV || 'center'));
            });
            document.querySelectorAll('[data-anchor-h]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-anchor-h') === (preset.anchorH || 'center'));
            });
        }

        function selectCameraSession(sessionName) {
            activeSessionName = sessionName;
            applySessionCameraPreset(sessionName, 450);
            updateCameraHudDOM();

            // Sincroniza com o menu inferior
            const navBtn = document.querySelector(`.nav-item[data-tab="${sessionName}"]`);
            if (navBtn) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                navBtn.classList.add('active');
                loadTabContent(sessionName);
            }
        }

        // Aplica a câmera gravada de forma 100% EXATA e fiel ao que o usuário configurou
        function applySessionCameraPreset(sessionName, duration = 450, customSheetH = null) {
            activeSessionName = sessionName;
            const preset = sessionCameraPresets[sessionName] || sessionCameraPresets["Identidade"];
            
            let targetScale = preset.scale || DEFAULT_SCALE;
            let targetPanX = preset.panX !== undefined ? preset.panX : 0;
            let targetPanY = preset.panY !== undefined ? preset.panY : 0;

            const clamped = clampPan(targetPanX, targetPanY, targetScale);
            animateAvatarCamera(targetScale, clamped.x, clamped.y, duration);
            updateCameraHudDOM();
        }

        function applyResponsivePreset(sessionName, duration = 450, customSheetH = null) {
            applySessionCameraPreset(sessionName, duration, customSheetH);
        }

        // Grava a posição EXATA e instantânea da tela na sessão, no localStorage e no servidor
        function saveCurrentCameraToSession() {
            const prevAnchorV = (sessionCameraPresets[activeSessionName] && sessionCameraPresets[activeSessionName].anchorV) || 'center';
            const prevAnchorH = (sessionCameraPresets[activeSessionName] && sessionCameraPresets[activeSessionName].anchorH) || 'center';

            sessionCameraPresets[activeSessionName] = {
                scale: parseFloat(avatarScale.toFixed(2)),
                panX: Math.round(avatarPanX),
                panY: Math.round(avatarPanY),
                anchorV: prevAnchorV,
                anchorH: prevAnchorH
            };

            try {
                localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
            } catch(e) {}
            syncPresetToCloud(activeSessionName, sessionCameraPresets[activeSessionName]);

            const btn = document.getElementById('btnSaveCamera');
            if (btn) {
                const prev = btn.innerHTML;
                btn.innerHTML = `🟢 Gravado no Firebase!`;
                btn.style.backgroundColor = '#10b981';
                btn.style.color = '#ffffff';
                setTimeout(() => {
                    btn.innerHTML = prev;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 1800);
            }
            updateCameraHudDOM();
        }

        function resetCameraToDefault() {
            sessionCameraPresets["Identidade"] = { scale: 0.79, panX: 0, panY: 0, anchorV: "center", anchorH: "center" };
            sessionCameraPresets["Aparência"]  = { scale: 2.85, panX: 0, panY: 480, anchorV: "top", anchorH: "center" };
            sessionCameraPresets["Busto"]      = { scale: 3.53, panX: 0, panY: 260, anchorV: "center", anchorH: "center" };
            sessionCameraPresets["Pernas"]     = { scale: 1.65, panX: 0, panY: -210, anchorV: "center", anchorH: "center" };
            sessionCameraPresets["Pés"]        = { scale: 2.65, panX: 0, panY: -780, anchorV: "bottom", anchorH: "center" };
            sessionCameraPresets["Estilo"]     = { scale: 1.12, panX: 0, panY: 15, anchorV: "center", anchorH: "center" };
            sessionCameraPresets["Gravação"]   = { scale: 0.92, panX: 0, panY: 0, anchorV: "center", anchorH: "center" };
            
            try {
                localStorage.setItem('mytype_camera_presets_v5', JSON.stringify(sessionCameraPresets));
            } catch(e) {}

            applySessionCameraPreset(activeSessionName, 400);
        }

        function exportCameraPresets() {
            const exportData = {
                sessionCameraPresets: sessionCameraPresets
            };
            const jsonText = JSON.stringify(exportData, null, 4);
            if (navigator.clipboard) {
                navigator.clipboard.writeText(jsonText);
            }
            const btn = document.getElementById('btnExportCamera');
            if (btn) {
                const prev = btn.innerHTML;
                btn.innerHTML = `✅ Copiado!`;
                setTimeout(() => { btn.innerHTML = prev; }, 2000);
            }
        }

        function updateAvatarTransform(smooth = false) {
            if (smooth) {
                avatarContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
            } else {
                avatarContainer.style.transition = 'none';
            }
            avatarContainer.style.transform = `translate3d(${avatarPanX}px, ${avatarPanY}px, 0px) scale(${avatarScale})`;
            updateCameraHudDOM();
        }

        function animateAvatarCamera(targetScale, targetX, targetY, duration = 480) {
            isCameraAnimating = true;
            avatarContainer.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
            avatarScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, targetScale));
            avatarPanX = targetX;
            avatarPanY = targetY;
            avatarContainer.style.transform = `translate(${avatarPanX}px, ${avatarPanY}px) scale(${avatarScale})`;
            updateCameraHudDOM();

            setTimeout(() => {
                isCameraAnimating = false;
                avatarContainer.style.transition = 'none';
            }, duration);
        }

        /* --- LIMITES SEGUROS DE MOVIMENTO DA CÂMERA --- */
        function getStrictPanBounds(scale = avatarScale) {
            const m = getAvatarLayoutMetrics();
            const scaledW = m.renderedW * scale;
            const scaledH = m.renderedH * scale;

            let maxX = Math.max(m.w * 0.45, (scaledW - m.w) * 0.65 + (m.w * 0.35));
            let minX = -maxX;

            let maxY = Math.max(m.h * 0.85, (scaledH - m.h) * 0.95 + (m.h * 0.75));
            let minY = -Math.max(m.h * 0.85, (scaledH - m.h) * 0.95 + (m.h * 0.75));

            if (minX > maxX) [minX, maxX] = [maxX, minX];
            if (minY > maxY) [minY, maxY] = [maxY, minY];

            return { minX, maxX, minY, maxY };
        }

        function clampPan(x, y, scale = avatarScale) {
            const bounds = getStrictPanBounds(scale);
            return {
                x: Math.min(bounds.maxX, Math.max(bounds.minX, x)),
                y: Math.min(bounds.maxY, Math.max(bounds.minY, y))
            };
        }

                /* --- ZOOM COM SCROLL DO MOUSE (FOCO NO CURSOR) --- */
        if (viewportCanvas) {
            viewportCanvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (isCameraAnimating) return;

                const rect = viewportCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;

                const zoomFactor = e.deltaY < 0 ? 1.14 : 0.88;
                const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, avatarScale * zoomFactor));

                if (newScale !== avatarScale) {
                    let nextX = mouseX - (mouseX - avatarPanX) * (newScale / avatarScale);
                    let nextY = mouseY - (mouseY - avatarPanY) * (newScale / avatarScale);
                    avatarScale = newScale;

                    const clamped = clampPan(nextX, nextY);
                    avatarPanX = clamped.x;
                    avatarPanY = clamped.y;
                    updateAvatarTransform(false);
                }
            }, { passive: false });
        }

        /* --- GESTOR UNIFICADO DE TOQUES E PINÇA (POINTER EVENTS ENGINE) --- */
        const activePointers = new Map();
        let lastTapTime = 0;
        let pinchPrevDist = 0;
        let pinchPrevMidX = 0;
        let pinchPrevMidY = 0;

        function getPointersMidpoint() {
            const pts = Array.from(activePointers.values());
            if (pts.length < 2) return null;
            const rect = viewportCanvas.getBoundingClientRect();
            const p1 = pts[0];
            const p2 = pts[1];
            const dist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
            const midX = ((p1.clientX + p2.clientX) / 2) - rect.left - (rect.width / 2);
            const midY = ((p1.clientY + p2.clientY) / 2) - rect.top - (rect.height / 2);
            return { dist, midX, midY };
        }

        if (viewportCanvas) {
            viewportCanvas.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.side-menu') || e.target.closest('.bottom-sheet') || e.target.closest('.footer-nav') || e.target.closest('.camera-hud-group')) return;
                
                // Duplo toque / duplo clique para alternar zoom rápido
                if (activePointers.size === 0) {
                    const now = performance.now();
                    if (now - lastTapTime < 300 && now - lastTapTime > 40) {
                        e.preventDefault();
                        lastTapTime = 0;
                        if (avatarScale > 1.3) {
                            animateAvatarCamera(DEFAULT_SCALE, 0, 0, 380);
                        } else {
                            const rect = viewportCanvas.getBoundingClientRect();
                            const tapX = e.clientX - rect.left - (rect.width / 2);
                            const tapY = e.clientY - rect.top - (rect.height / 2);
                            const clamped = clampPan(-tapX * 0.75, -tapY * 0.75, 2.2);
                            animateAvatarCamera(2.2, clamped.x, clamped.y, 380);
                        }
                        return;
                    }
                    lastTapTime = now;
                }

                activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
                try { viewportCanvas.setPointerCapture(e.pointerId); } catch(err){}

                if (activePointers.size === 2) {
                    const p = getPointersMidpoint();
                    if (p) {
                        pinchPrevDist = p.dist;
                        pinchPrevMidX = p.midX;
                        pinchPrevMidY = p.midY;
                    }
                }
            });

            viewportCanvas.addEventListener('pointermove', (e) => {
                if (!activePointers.has(e.pointerId) || isCameraAnimating) return;

                const prevPtr = activePointers.get(e.pointerId);
                const deltaSingleX = e.clientX - prevPtr.clientX;
                const deltaSingleY = e.clientY - prevPtr.clientY;
                activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

                if (activePointers.size === 1) {
                    // ARRASTE COM 1 DEDO / MOUSE (PANNING 1:1)
                    const nextX = avatarPanX + deltaSingleX;
                    const nextY = avatarPanY + deltaSingleY;
                    const clamped = clampPan(nextX, nextY, avatarScale);
                    avatarPanX = clamped.x;
                    avatarPanY = clamped.y;
                    updateAvatarTransform(false);
                } else if (activePointers.size >= 2) {
                    // PINÇA E ARRASTE SIMULTÂNEO COM 2 DEDOS (PINCH-TO-ZOOM + PAN)
                    const p = getPointersMidpoint();
                    if (p && pinchPrevDist > 0) {
                        const distRatio = p.dist / pinchPrevDist;
                        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, avatarScale * distRatio));

                        // Ponto fixo exato sob os dedos: mantém o ponto sob a pinça 100% ancorado nos dedos
                        let nextX = p.midX - (pinchPrevMidX - avatarPanX) * (newScale / avatarScale);
                        let nextY = p.midY - (pinchPrevMidY - avatarPanY) * (newScale / avatarScale);

                        avatarScale = newScale;
                        const clamped = clampPan(nextX, nextY, avatarScale);
                        avatarPanX = clamped.x;
                        avatarPanY = clamped.y;
                        updateAvatarTransform(false);

                        pinchPrevDist = p.dist;
                        pinchPrevMidX = p.midX;
                        pinchPrevMidY = p.midY;
                    }
                }
            });

            function handlePointerUpOrCancel(e) {
                if (activePointers.has(e.pointerId)) {
                    activePointers.delete(e.pointerId);
                    try { viewportCanvas.releasePointerCapture(e.pointerId); } catch(err){}
                }

                if (activePointers.size === 1) {
                    // Ao soltar 1 dos dedos, re-ancora o dedo restante para transição suave sem saltos
                    const remainingEntry = Array.from(activePointers.entries())[0];
                    if (remainingEntry) {
                        activePointers.set(remainingEntry[0], {
                            clientX: remainingEntry[1].clientX,
                            clientY: remainingEntry[1].clientY
                        });
                    }
                    pinchPrevDist = 0;
                } else if (activePointers.size === 0) {
                    pinchPrevDist = 0;
                }
            }

            viewportCanvas.addEventListener('pointerup', handlePointerUpOrCancel);
            viewportCanvas.addEventListener('pointercancel', handlePointerUpOrCancel);
        }

        /* --- CONTROLE DE ARRASTE DA JANELA PELA BARRA DE TÍTULO (DESKTOP) --- */
        let isPhoneDragging = false;
        let phonePosX = 0;
        let phonePosY = 0;
        let phoneDragStartX = 0;
        let phoneDragStartY = 0;
        let phoneInitialX = 0;
        let phoneInitialY = 0;

        const titlebarEl = document.getElementById('desktopTitlebar');
        if (titlebarEl) {
            titlebarEl.addEventListener('pointerdown', (e) => {
                if (window.innerWidth <= 500) return;

                e.preventDefault();

                isPhoneDragging = true;
                phoneDragStartX = e.clientX;
                phoneDragStartY = e.clientY;
                phoneInitialX = phonePosX;
                phoneInitialY = phonePosY;

                phoneMovableFrame.style.transition = 'none';
                try { titlebarEl.setPointerCapture(e.pointerId); } catch(err) {}
            });

            titlebarEl.addEventListener('pointermove', (e) => {
                if (!isPhoneDragging) return;
                phonePosX = phoneInitialX + (e.clientX - phoneDragStartX);
                phonePosY = phoneInitialY + (e.clientY - phoneDragStartY);
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            });

            titlebarEl.addEventListener('pointerup', (e) => {
                if (!isPhoneDragging) return;
                isPhoneDragging = false;
                try { titlebarEl.releasePointerCapture(e.pointerId); } catch(err) {}
                snapPhoneToBoundaries();

            titlebarEl.addEventListener('pointercancel', (e) => {
                if (!isPhoneDragging) return;

        function resetWindowSizeAndPos(e) {

        /* --- REDIMENSIONAMENTO LIVRE DE JANELA ESTILO WINDOWS (DESKTOP) --- */
        let isResizingWindow = false;
        let resizeDir = '';
        let resizeStartX = 0;
        let resizeStartY = 0;
        let resizeStartWidth = 0;
        let resizeStartHeight = 0;
        let resizeStartPosX = 0;

        document.querySelectorAll('.win-resize-handle').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
                if (window.innerWidth <= 500) return;
                e.preventDefault();
                e.stopPropagation();

                isResizingWindow = true;
                resizeDir = handle.getAttribute('data-resize');
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;

                const rect = appContainer.getBoundingClientRect();
                resizeStartWidth = rect.width;
                resizeStartHeight = rect.height;
                resizeStartPosX = phonePosX;
                resizeStartPosY = phonePosY;

                document.body.style.userSelect = 'none';
                phoneMovableFrame.style.transition = 'none';
                try { handle.setPointerCapture(e.pointerId); } catch(err){}
            });

            handle.addEventListener('pointermove', (e) => {
                if (!isResizingWindow) return;
                const dx = e.clientX - resizeStartX;
                const dy = e.clientY - resizeStartY;

                let newW = resizeStartWidth;
                let newH = resizeStartHeight;
                let newX = resizeStartPosX;
                let newY = resizeStartPosY;

                if (resizeDir.includes('e')) {
                    newW = Math.max(260, Math.min(window.innerWidth * 0.95, resizeStartWidth + dx));
                }
                if (resizeDir.includes('w')) {
                    const candidateW = resizeStartWidth - dx;
                    if (candidateW >= 260 && candidateW <= window.innerWidth * 0.95) {
                        newW = candidateW;
                        newX = resizeStartPosX + dx;
                    }
                }
                if (resizeDir.includes('s')) {
                    newH = Math.max(420, Math.min(window.innerHeight * 0.96, resizeStartHeight + dy));
                }
                if (resizeDir.includes('n')) {
                    const candidateH = resizeStartHeight - dy;
                    if (candidateH >= 420 && candidateH <= window.innerHeight * 0.96) {
                        newH = candidateH;
                        newY = resizeStartPosY + dy;
                    }
                }

                appContainer.style.width = `${newW}px`;
                appContainer.style.maxWidth = `${newW}px`;
                appContainer.style.height = `${newH}px`;
                appContainer.style.maxHeight = `${newH}px`;
                appContainer.style.aspectRatio = 'unset';

                phonePosX = newX;
                phonePosY = newY;
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;

                renderSheetLimitLine();
                syncSheetLayout();
                if (activeSessionName) {
                    applyResponsivePreset(activeSessionName, 0);
                }
            });

            const stopWindowResize = (e) => {
                if (!isResizingWindow) return;
                isResizingWindow = false;
                document.body.style.userSelect = '';
                try { handle.releasePointerCapture(e.pointerId); } catch(err){}
                snapPhoneToBoundaries();
                renderSheetLimitLine();
                syncSheetLayout();
                if (activeSessionName) {
                    applyResponsivePreset(activeSessionName, 0);
                }
            };

            handle.addEventListener('pointerup', stopWindowResize);
            handle.addEventListener('pointercancel', stopWindowResize);
        });

        function snapPhoneToBoundaries() {
            if (window.innerWidth <= 500) return;

            const rect = appContainer.getBoundingClientRect();
            const pad = 16;
            let deltaX = 0;
            let deltaY = 0;

            if (rect.left < pad + 20) { 
                deltaX = (pad + 20) - rect.left;
            } else if (rect.right > window.innerWidth - pad - 20) { 
                deltaX = (window.innerWidth - pad - 20) - rect.right;
            }

            if (rect.top < pad + 20) {
                deltaY = (pad + 20) - rect.top;
            } else if (rect.bottom > window.innerHeight - pad) {
                deltaY = (window.innerHeight - pad) - rect.bottom;
            }

            if (deltaX !== 0 || deltaY !== 0) {
                phonePosX += deltaX;
                phonePosY += deltaY;
                phoneMovableFrame.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            }
        }

        /* --- MINIMIZAR / RESTAURAR MINI CELULAR --- */
        if (btnMinimize) {
            btnMinimize.addEventListener('click', (e) => {
                e.stopPropagation();
                minimizePhoneWindow();
            });
        }

        function minimizePhoneWindow() {
            phoneMovableFrame.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY + 60}px) scale(0.25)`;
            phoneMovableFrame.style.opacity = '0';
            phoneMovableFrame.style.pointerEvents = 'none';

            setTimeout(() => {
                floatingBubble.classList.add('visible');
            }, 180);
        }

        function restorePhoneWindow() {
            floatingBubble.classList.remove('visible');

            phoneMovableFrame.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px) scale(1)`;
            phoneMovableFrame.style.opacity = '1';
            phoneMovableFrame.style.pointerEvents = 'auto';

            setTimeout(() => {
                snapPhoneToBoundaries();
            }, 420);
        }

        /* --- BOTTOM SHEET DRAG & STATE (AJUSTE MANUAL SUAVE + GESTO RÁPIDO/FLICK) --- */
        let isDraggingSheet = false;
        let sheetStartY = 0;
        let sheetStartHeight = 0;
        let sheetHasMoved = false; 
        let sheetStartTime = 0;
        let lastMoveY = 0;
        let lastMoveTime = 0;
        let sheetVelocityY = 0; // px / ms (positivo = subindo rápido, negativo = descendo rápido)

        function getFooterNavTopDistance() {
            const nav = document.querySelector('.footer-nav');
            if (!nav || !appContainer) return (window.innerWidth <= 500 ? 70 : 58);
            const navRect = nav.getBoundingClientRect();
            const containerRect = appContainer.getBoundingClientRect();
            const dist = containerRect.bottom - navRect.top;
            return dist > 10 ? dist : (window.innerWidth <= 500 ? 70 : 58);
        }

        function getMinHeight() {
            const isMobile = window.innerWidth <= 500;
            const navTopDist = getFooterNavTopDistance();
            // Espaço proporcional reduzido em 8px acima da barra de opções
            const headerSpaceAboveNav = isMobile ? 46 : 36;
            return Math.round(navTopDist + headerSpaceAboveNav);
        }

        function getMaxHeight() { 
            const isMobile = window.innerWidth <= 500;
            return appContainer.clientHeight - (isMobile ? 32 : 28); 
        }

        function getInitialHeight() { 
            // Altura padrão de 45% (-3%) da altura da tela disponível ao alterar as abas
            const availableH = appContainer ? appContainer.clientHeight : window.innerHeight;
            return Math.round(availableH * 0.45);
        }

        function syncSheetLayout() {
            if (isDraggingSheet) return;
            const minH = getMinHeight();
            bottomSheet.style.height = minH + 'px';
            updateSheetState(minH);
            renderSheetLimitLine();
        }

        let currentHeight = getMinHeight();
        bottomSheet.style.height = currentHeight + 'px';
        updateSheetState(currentHeight);

        function renderSheetLimitLine() {
            const line = document.getElementById('sheetDragLimitLine');
            if (!appContainer) return;
            
            const minH = getMinHeight();
            const maxH = getMaxHeight();
            const topPos = appContainer.clientHeight - maxH;
            
            if (line) {
                line.style.top = `${topPos}px`;
            }

            // O canvas (.viewport) se estende até a base para que a transparência dos cantos arredondados mostre o degradê do fundo naturalmente
            if (viewportCanvas) {
                viewportCanvas.style.top = `${topPos}px`;
                viewportCanvas.style.bottom = `0px`;
            }

            // Mantém os ícones laterais sempre abaixo da linha divisória
            if (sideMenu) {
                sideMenu.style.top = `${topPos + 10}px`;

        sheetHeader.addEventListener('pointerdown', (e) => {
            isDraggingSheet = true;
            sheetHasMoved = false;
            sheetHandle.classList.add('active-pink'); 
            sheetStartY = e.clientY;
            lastMoveY = e.clientY;
            sheetStartTime = performance.now();
            lastMoveTime = sheetStartTime;
            sheetVelocityY = 0;
            sheetStartHeight = bottomSheet.clientHeight;
            bottomSheet.style.transition = 'none';
            try { sheetHeader.setPointerCapture(e.pointerId); } catch(err){}
        });

        sheetHeader.addEventListener('pointermove', (e) => {
            if (!isDraggingSheet) return;
            const diff = sheetStartY - e.clientY;
            if (Math.abs(diff) > 3) sheetHasMoved = true;
            
            const now = performance.now();
            const dt = now - lastMoveTime;
            if (dt > 8) {
                // Velocidade instantânea do movimento (positivo = subindo, negativo = descendo)
                sheetVelocityY = (lastMoveY - e.clientY) / dt;
                lastMoveY = e.clientY;
                lastMoveTime = now;
            }

            let newHeight = sheetStartHeight + diff;
            const minH = getMinHeight();
            const maxH = getMaxHeight();
            if (newHeight < minH) newHeight = minH;
            if (newHeight > maxH) newHeight = maxH;

            bottomSheet.style.height = newHeight + 'px';
            updateSheetState(newHeight);
            applySessionCameraPreset(activeSessionName, 0, newHeight);
        });

        sheetHeader.addEventListener('pointerup', (e) => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            sheetHandle.classList.remove('active-pink'); 
            try { sheetHeader.releasePointerCapture(e.pointerId); } catch(err){}

            const totalTime = performance.now() - sheetStartTime;
            const totalDiff = sheetStartY - e.clientY;
            const minH = getMinHeight();
            const maxH = getMaxHeight();
            let targetH;

            // Detecção de Swipe Rápido / Flick (arrastar bem rápido com o dedo ou mouse)
            const isFastFlickUp = sheetVelocityY > 0.45 || (totalDiff > 45 && totalTime < 240);
            const isFastFlickDown = sheetVelocityY < -0.45 || (totalDiff < -45 && totalTime < 240);

            if (isFastFlickUp) {
                // Arraste RÁPIDO pra cima: abre todo!
                targetH = maxH;
            } else if (isFastFlickDown) {
                // Arraste RÁPIDO pra baixo: fecha todo!
                targetH = minH;
            } else if (sheetHasMoved) {
                // Arraste NORMAL / AJUSTE MANUAL: mantém exatamente na altura onde o usuário soltou!
                targetH = Math.max(minH, Math.min(maxH, bottomSheet.clientHeight));

                // Clique/Toque simples: alterna entre aberto inicial e fechado
                if (bottomSheet.clientHeight <= minH + 15) {
                    targetH = getInitialHeight();

                }

            bottomSheet.style.height = targetH + 'px';
            updateSheetState(targetH);
            applySessionCameraPreset(activeSessionName, 280, targetH);

        function updateSheetState(height) {
            const minH = getMinHeight();

            const range = maxH - minH;
            const progress = (height - minH) / (range || 1);

            if (height <= minH + 15) {
                sheetTitle.classList.remove('is-hidden');
                sheetContent.style.opacity = '0';
                sheetContent.style.pointerEvents = 'none';
            } else {
                sheetTitle.classList.add('is-hidden');
                sheetContent.style.opacity = '1';
                sheetContent.style.pointerEvents = 'auto';
            }
        }

        function enableHorizontalDrag(containerId) {
            const slider = document.getElementById(containerId);
            if (!slider) return;
            let isDown = false;
            let startX, scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        /* --- ESTADO E GERENCIAMENTO MODULAR DO AVATAR --- */
        const avatarState = {
            hairStyle: "Liso longo",
            hairColor: "#1a1a1a",
            outfit: "Casual"
        };

        const layerBase = document.getElementById('layerBase');
        const layerOutfit = document.getElementById('layerOutfit');
        const layerHair = document.getElementById('layerHair');

        const hairColorFilters = {
            "#1a1a1a": "none",
            "#3b2b22": "sepia(0.5) brightness(0.85) hue-rotate(330deg)",
            "#6b442b": "sepia(0.6) brightness(1.1) saturate(1.5) hue-rotate(345deg)",
            "#a87d4a": "sepia(0.7) brightness(1.25) saturate(1.8) hue-rotate(15deg)",
            "#e6c594": "sepia(0.5) brightness(1.45) saturate(1.4) hue-rotate(30deg)",
            "#c93b3b": "sepia(0.8) brightness(0.95) saturate(3.2) hue-rotate(310deg)",
            "#3b7dc9": "hue-rotate(185deg) saturate(2.5) brightness(0.95)",
            "#ffffff": "grayscale(1) brightness(1.6) contrast(1.1)"
        };

        function applyHairStyle(styleName) {
            avatarState.hairStyle = styleName;
            if (styleName === "Curto") {
                layerHair.src = "assets/hair_blonde_bob.png";
                layerHair.classList.remove('hidden');
            } else if (styleName === "Cacheado" || styleName === "Ondulado" || styleName === "Afro") {
                layerHair.src = "assets/hair_curly_dark.png";
                layerHair.classList.remove('hidden');
            } else {
                // Liso longo original da base
                layerHair.classList.add('hidden');
            }
            applyHairColor(avatarState.hairColor);
        }

        function applyHairColor(hexColor) {
            avatarState.hairColor = hexColor;
            const filterValue = hairColorFilters[hexColor] || "none";
            layerHair.style.filter = filterValue;
        }

        function applyOutfit(outfitName) {
            avatarState.outfit = outfitName;
            if (outfitName === "Casual" || outfitName === "Esportivo" || outfitName === "Social") {
                layerOutfit.src = "assets/outfit_casual.png";
                layerOutfit.classList.remove('hidden');
            } else if (outfitName === "Lingerie" || outfitName === "Biquíni" || outfitName === "Base") {
                layerOutfit.classList.add('hidden');
            }
        }

        function loadTabContent(tabName) {
            const data = tabData[tabName];
            if (!data) return;

            if (sheetContent) {
                sheetContent.scrollTop = 0;
            }

            sideMenu.innerHTML = '';
            data.sideButtons.forEach((btnData, index) => {
                const button = document.createElement('button');
                button.className = `side-item ${index === 0 ? 'active' : ''}`;
                button.onclick = function() { 
                    selectSideOption(this); 
                };
                button.innerHTML = `
                    <div class="side-icon-wrapper"><svg viewBox="0 0 24 24">${btnData.icon}</svg></div>
                    ${btnData.label}
                `;
                sideMenu.appendChild(button);
            });

            sheetContent.innerHTML = data.sheetHTML;
            if (sheetContent) {
                sheetContent.scrollTop = 0;
            }

            // Anima a câmera para o preset responsivo correspondente da aba
            applyResponsivePreset(tabName, 480);

            setTimeout(() => {
                enableHorizontalDrag('stylesScroll');
                enableHorizontalDrag('colorsScroll');
                enableHorizontalDrag('bustoScroll');
                enableHorizontalDrag('pernasScroll');
                enableHorizontalDrag('pesScroll');
                enableHorizontalDrag('estiloScroll');
                enableHorizontalDrag('gravacaoScroll');
            }, 50);
        }

        function selectSideOption(el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function selectStyle(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const label = el.querySelector('span') ? el.querySelector('span').innerText.trim() : '';

            if (parent.id === 'stylesScroll') {
                applyHairStyle(label);
            } else if (parent.id === 'estiloScroll') {
                applyOutfit(label);
            } else if (parent.id === 'pesScroll') {
                if (label === 'Descalço') {
                    layerOutfit.classList.add('hidden');
                } else {
                    layerOutfit.classList.remove('hidden');
                }
            }
        }

        function selectColor(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            const hex = el.getAttribute('data-color') || el.style.backgroundColor;
            if (parent.id === 'colorsScroll') {
                applyHairColor(hex);
            }
        }

        function selectFooterTab(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const tabName = el.getAttribute('data-tab');
            loadTabContent(tabName);

            // Aumenta o menu para a altura padrão ao clicar nas opções
            const targetH = getInitialHeight();
            bottomSheet.style.transition = 'height 0.32s cubic-bezier(0.22, 1, 0.36, 1)';
            bottomSheet.style.height = targetH + 'px';
            updateSheetState(targetH);
        }

        // Recalcula o enquadramento responsivo em rotação ou redimensionamento de janela
        window.addEventListener('resize', () => {
            if (activeSessionName) {
                applyResponsivePreset(activeSessionName, 0);
            }
            renderSheetLimitLine();
        });

        // Inicia carregando a aba "Identidade" e com as configurações fechadas perfeitamente sincronizadas
        loadTabContent("Identidade");
        syncSheetLayout();

        // Garante sincronização perfeita no iPhone após pintura do layout e Safe-Area
        window.addEventListener('load', () => {
            syncSheetLayout();
            fetchServerPresets();
        });
        window.addEventListener('pageshow', () => {
            syncSheetLayout();
            fetchServerPresets();
        });
        window.addEventListener('orientationchange', () => setTimeout(syncSheetLayout, 120));
        setTimeout(syncSheetLayout, 60);
        setTimeout(syncSheetLayout, 200);
        setTimeout(syncSheetLayout, 500);
        setTimeout(fetchServerPresets, 100);
    </script>
