<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customizador de Avatar Dinâmico</title>
    <style>
        :root {
            --bg-main: #0c0b0e;
            --bg-container: #1a181f;
            --bg-sheet: #14141b;
            --bg-card: #27242b;
            --bg-pill: #1b1b21;
            --primary: #c96b7c;
            --text-main: #ffffff;
            --text-secondary: #8c8891;
            --text-muted: #b0acb8;
            --border-color: #26242f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .phone-movable-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        .app-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Desktop: Janela Móvel, Área Livre Arrastável e Botões nas Quinas */
        @media (min-width: 501px) {
            body {
                background: radial-gradient(circle at center, #1b1922 0%, #0c0b0e 100%);
            }

            .phone-wrapper {
                padding: 16px;
                cursor: grab;
            }

            .phone-wrapper:active {
                cursor: grabbing;
            }

            .app-container {
                width: 350px;
                height: calc(100vh - 24px);
                max-height: 94vh;
                border-radius: 34px;
                border: 2px solid var(--border-color);
                box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
                position: relative;
                cursor: default;
            }

            /* Botão/Alça de Arrastar FORA do card (Canto Superior Esquerdo) */
            .window-drag-handle {
                position: absolute;
                top: 14px;
                left: -48px;
                width: 38px;
                height: 44px;
                background-color: var(--bg-card);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                cursor: grab;
                z-index: 70;
                color: var(--text-secondary);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
                transition: all 0.2s ease;
                touch-action: none;
            }

            .window-drag-handle:hover {
                background-color: #332f3b;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.08) translateX(-2px);
            }

            .window-drag-handle:active {
                cursor: grabbing;
                transform: scale(0.96) translateX(-2px);
                background-color: rgba(201, 107, 124, 0.15);
            }

            .window-drag-handle svg {
                width: 18px;
                height: 18px;
                fill: currentColor;
            }

            .drag-handle-dots {
                display: flex;
                gap: 2px;
            }

            .drag-handle-dot {
                width: 3px;
                height: 3px;
                background-color: currentColor;
                border-radius: 50%;
                opacity: 0.6;
            }

            /* Botão de Minimizar em formato de BOLA e SOBREPOSTO na quina do card */
            .window-btn-minimize {
                position: absolute;
                top: -12px;
                right: -12px;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: #232029;
                border: 2px solid rgba(255, 255, 255, 0.2);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 80;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
                transition: all 0.2s ease;
            }

            .window-btn-minimize:hover {
                background-color: #382c33;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.15);
                box-shadow: 0 8px 24px rgba(201, 107, 124, 0.4);
            }

            .window-btn-minimize:active {
                transform: scale(0.92);
            }

            .window-btn-minimize svg {
                width: 14px;
                height: 14px;
                fill: currentColor;
            }
        }

        /* Celular Físico: Ocupa 100% da tela e altura do navegador */
        @media (max-width: 500px) {
            .phone-wrapper,
            .phone-movable-frame {
                width: 100%;
                height: 100%;
                padding: 0;
                transform: none !important;
                cursor: default !important;
            }

            .app-container {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .window-drag-handle,
            .window-btn-minimize,
            .floating-mini-phone {
                display: none !important;
            }
        }

        /* Celularzinho em miniatura suspenso quando minimizado */
        .floating-mini-phone {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px;
            height: 96px;
            border-radius: 16px;
            background-color: #121118;
            border: 2px solid var(--primary);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(201, 107, 124, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.3) rotate(-15deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, box-shadow 0.2s;
            padding: 3px;
        }

        .floating-mini-phone.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) rotate(0deg);
            animation: miniPhoneFloat 3.5s ease-in-out infinite alternate;
        }

        .floating-mini-phone:hover {
            transform: scale(1.15) rotate(4deg) !important;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 35px rgba(201, 107, 124, 0.7);
            border-color: #ffffff;
        }

        .mini-phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--bg-container);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-phone-notch {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            z-index: 5;
        }

        .mini-phone-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            pointer-events: none;
        }

        .mini-phone-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #25d366;
            border: 1.5px solid var(--bg-container);
            box-shadow: 0 0 6px rgba(37, 211, 102, 0.9);
            z-index: 6;
        }

        .mini-phone-bar {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            z-index: 5;
        }

        @keyframes miniPhoneFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            bottom: 74px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #382e3f 0%, #17151b 75%);
            overflow: hidden;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            position: absolute;
            bottom: 0;
        }

        .side-menu {
            position: absolute;
            right: 10px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            max-height: calc(100% - 100px);
            overflow-y: auto;
            scrollbar-width: none;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
        }

        .side-menu::-webkit-scrollbar {
            display: none;
        }

        .side-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            gap: 2px;
            transition: color 0.2s;
        }

        .side-item.active {
            color: var(--primary);
        }

        .side-icon-wrapper {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-icon-wrapper svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .footer-nav {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 8px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            z-index: 40;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .footer-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            transition: color 0.2s;
            flex: 0 0 calc((100% - (4 * 6px)) / 5);
            min-width: 50px;
            white-space: nowrap;
        }

        @media (max-width: 360px) {
            .nav-item {
                flex: 0 0 54px;
            }
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon-wrapper {
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon-wrapper svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 74px;
            left: 0;
            width: 100%;
            background-color: var(--bg-sheet);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 8px 14px 14px 14px;
            z-index: 30;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-header-area {
            width: 100%;
            cursor: pointer;
            padding: 4px 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            touch-action: none;
        }

        .sheet-handle {
            width: 36px;
            height: 5px;
            background-color: #5c5765;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .sheet-header-area:hover .sheet-handle,
        .sheet-header-area:active .sheet-handle,
        .sheet-handle.active-pink {
            background-color: var(--primary);
        }

        .sheet-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .sheet-content {
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            opacity: 1;
            transition: opacity 0.15s ease;
            -webkit-overflow-scrolling: touch;
        }

        .sheet-content::-webkit-scrollbar {
            display: none;
        }

        .sheet-content > * {
            flex-shrink: 0;
        }

        .section-title {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .section-divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .styles-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .styles-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .style-card {
            background-color: var(--bg-card); 
            border: 2px solid transparent;
            border-radius: 14px;
            min-width: 68px;
            height: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .style-card.active {
            border-color: var(--primary);
        }

        .style-card span {
            font-size: 9.5px;
            color: var(--text-muted);
            white-space: nowrap;
            pointer-events: none;
        }

        .colors-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .colors-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .color-dot {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .color-dot.active {
            border-color: var(--primary);
            padding: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper" id="phoneWrapper">
        <div class="phone-movable-frame" id="phoneMovableFrame">
            
            <!-- Botão de Arrastar (Canto Superior Esquerdo FORA do card) -->
            <div class="window-drag-handle" id="windowDragHandle" title="Clique e segure para arrastar a janela">
                <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
                <div class="drag-handle-dots">
                    <div class="drag-handle-dot"></div>
                    <div class="drag-handle-dot"></div>
                    <div class="drag-handle-dot"></div>
                </div>
            </div>

            <!-- Botão de Minimizar em formato de BOLA SOBREPOSTO na quina do card -->
            <button class="window-btn-minimize" id="btnMinimize" title="Minimizar (vira celularzinho no canto)" aria-label="Minimizar">
                <svg viewBox="0 0 24 24"><path d="M19,13H5V11H19V13Z"/></svg>
            </button>

            <div class="app-container" id="appContainer">
                
                <div class="viewport">
                    <div class="avatar-container">
                        <img src="avatar.png" alt="Avatar Model" class="avatar-img" id="avatarImg">
                    </div>
                </div>

                <div class="side-menu" id="sideMenu"></div>

                <div class="bottom-sheet" id="bottomSheet">
                    <div class="sheet-header-area" id="sheetHeader">
                        <div class="sheet-handle" id="sheetHandle"></div>
                        <div class="sheet-title" id="sheetTitle">Configurações</div>
                    </div>
                    
                    <div class="sheet-content" id="sheetContent"></div>
                </div>

                <div class="footer-nav" id="footerNav">
                    <button class="nav-item" data-tab="Identidade" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg></div>
                        Identidade
                    </button>
                    <button class="nav-item active" data-tab="Aparência" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,2C9.24,2 7,4.24 7,7C7,8.87 8.03,10.5 9.58,11.36C6.61,12.43 4.5,15.28 4.5,18.5C4.5,18.78 4.72,19 5,19H19C19.28,19 19.5,18.78 19.5,18.5C19.5,15.28 17.39,12.43 14.42,11.36C15.97,10.5 17,8.87 17,7C17,4.24 14.76,2 12,2M12,4C13.66,4 15,5.34 15,7C15,8.66 13.66,10 12,10C10.34,10 9,8.66 9,7C9,5.34 10.34,4 12,4M12,13C15.03,13 17.5,15.47 17.5,18.5H6.5C6.5,15.47 8.97,13 12,13Z"/></svg></div>
                        Aparência
                    </button>
                    <button class="nav-item" data-tab="Busto" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5A3,3 0 0,1 12,8A3,3 0 0,1 9,5A3,3 0 0,1 12,2M12,10C14.67,10 20,11.34 20,14V16H4V14C4,11.34 9.33,10 12,10Z"/></svg></div>
                        Busto
                    </button>
                    <button class="nav-item" data-tab="Pernas" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M9,2H15V6H9V2M11,8H13V13H11V8M10,14H14V22H12V17H10V14Z"/></svg></div>
                        Pernas
                    </button>
                    <button class="nav-item" data-tab="Pés" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/></svg></div>
                        Pés
                    </button>
                    <button class="nav-item" data-tab="Estilo" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,3L2,12H5V20H19V12H22L12,3M12,7.7C14.1,7.7 15.8,9.4 15.8,11.5C15.8,13.6 14.1,15.3 12,15.3C9.9,15.3 8.2,13.6 8.2,11.5C8.2,9.4 9.9,7.7 12,7.7Z"/></svg></div>
                        Estilo
                    </button>
                    <button class="nav-item" data-tab="Gravação" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/></svg></div>
                        Gravação
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Celularzinho em miniatura suspenso quando minimizado -->
    <div class="floating-mini-phone" id="floatingBubble" title="Clique para abrir o My Type" onclick="restorePhoneWindow()">
        <div class="mini-phone-screen">
            <div class="mini-phone-notch"></div>
            <img src="avatar.png" alt="My Type" class="mini-phone-avatar">
            <div class="mini-phone-badge"></div>
            <div class="mini-phone-bar"></div>
        </div>
    </div>

    <script>
        const bottomSheet = document.getElementById('bottomSheet');
        const sheetHeader = document.getElementById('sheetHeader');
        const sheetContent = document.getElementById('sheetContent');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetHandle = document.getElementById('sheetHandle');
        const appContainer = document.getElementById('appContainer');
        const phoneWrapper = document.getElementById('phoneWrapper');
        const phoneMovableFrame = document.getElementById('phoneMovableFrame');
        const sideMenu = document.getElementById('sideMenu');
        const windowDragHandle = document.getElementById('windowDragHandle');
        const btnMinimize = document.getElementById('btnMinimize');
        const floatingBubble = document.getElementById('floatingBubble');

        /* --- CONTROLE DE ARRASTE DA JANELA (ÁREA LIVRE + ALÇA) --- */
        let isPhoneDragging = false;
        let phonePosX = 0;
        let phonePosY = 0;
        let phoneDragStartX = 0;
        let phoneDragStartY = 0;

        // Iniciar arraste ao clicar na alça ou em qualquer área livre do fundo
        document.addEventListener('mousedown', (e) => {
            if (window.innerWidth <= 500) return;
            if (e.target.closest('#btnMinimize') || e.target.closest('#floatingBubble')) return;

            // Se clicou na alça de arraste OU fora do appContainer (área livre do navegador)
            const isHandle = e.target.closest('#windowDragHandle');
            const isOutsideContainer = !e.target.closest('#appContainer');

            if (isHandle || isOutsideContainer) {
                isPhoneDragging = true;
                phoneDragStartX = e.clientX - phonePosX;
                phoneDragStartY = e.clientY - phonePosY;
                phoneMovableFrame.style.transition = 'none';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPhoneDragging) return;
            phonePosX = e.clientX - phoneDragStartX;
            phonePosY = e.clientY - phoneDragStartY;
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
        });

        window.addEventListener('mouseup', () => {
            if (!isPhoneDragging) return;
            isPhoneDragging = false;
            snapPhoneToBoundaries();
        });

        function snapPhoneToBoundaries() {
            if (window.innerWidth <= 500) return;

            const rect = appContainer.getBoundingClientRect();
            const pad = 16;
            let deltaX = 0;
            let deltaY = 0;

            if (rect.left < pad + 48) { 
                deltaX = (pad + 48) - rect.left;
            } else if (rect.right > window.innerWidth - pad - 20) { 
                deltaX = (window.innerWidth - pad - 20) - rect.right;
            }

            if (rect.top < pad + 20) {
                deltaY = (pad + 20) - rect.top;
            } else if (rect.bottom > window.innerHeight - pad) {
                deltaY = (window.innerHeight - pad) - rect.bottom;
            }

            if (deltaX !== 0 || deltaY !== 0) {
                phonePosX += deltaX;
                phonePosY += deltaY;
                phoneMovableFrame.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            }
        }

        /* --- MINIMIZAR / RESTAURAR MINI CELULAR --- */
        if (btnMinimize) {
            btnMinimize.addEventListener('click', (e) => {
                e.stopPropagation();
                minimizePhoneWindow();
            });
        }

        function minimizePhoneWindow() {
            phoneMovableFrame.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY + 60}px) scale(0.25)`;
            phoneMovableFrame.style.opacity = '0';
            phoneMovableFrame.style.pointerEvents = 'none';

            setTimeout(() => {
                floatingBubble.classList.add('visible');
            }, 180);
        }

        function restorePhoneWindow() {
            floatingBubble.classList.remove('visible');

            phoneMovableFrame.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px) scale(1)`;
            phoneMovableFrame.style.opacity = '1';
            phoneMovableFrame.style.pointerEvents = 'auto';

            setTimeout(() => {
                snapPhoneToBoundaries();
            }, 420);
        }

        /* --- BOTTOM SHEET DRAG & STATE --- */
        let isDragging = false;
        let startY = 0;
        let startHeight = 0;
        let hasMoved = false; 
        const minHeight = 40; 

        function getMaxHeight() { 
            return appContainer.clientHeight - 110; 
        }
        function getInitialHeight() { 
            return Math.max(140, Math.min(appContainer.clientHeight * 0.32, 280)); 
        }

        let currentHeight = getInitialHeight();
        bottomSheet.style.height = currentHeight + 'px';
        updateSheetState(currentHeight);

        sheetHeader.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        sheetHeader.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        sheetHeader.addEventListener('click', (e) => {
            if (hasMoved) return;

            bottomSheet.style.transition = 'height 0.25s ease-out';
            if (bottomSheet.clientHeight <= minHeight + 15) {
                let targetH = getInitialHeight();
                bottomSheet.style.height = targetH + 'px';
                updateSheetState(targetH);
            } else {
                bottomSheet.style.height = minHeight + 'px';
                updateSheetState(minHeight);
            }
        });

        function getClientY(e) {
            return (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
        }

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            sheetHandle.classList.add('active-pink'); 
            startY = getClientY(e);
            startHeight = bottomSheet.clientHeight;
            bottomSheet.style.transition = 'none';
        }

        function onDrag(e) {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            hasMoved = true; 
            const currentY = getClientY(e);
            const diff = startY - currentY; 
            let newHeight = startHeight + diff;
            const max = getMaxHeight();
            if (newHeight < minHeight) newHeight = minHeight;
            if (newHeight > max) newHeight = max;

            bottomSheet.style.height = newHeight + 'px';
            updateSheetState(newHeight);
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            sheetHandle.classList.remove('active-pink'); 
            bottomSheet.style.transition = 'height 0.2s ease-out';
        }

        function updateSheetState(height) {
            const max = getMaxHeight();
            const range = max - minHeight;
            const progress = (height - minHeight) / (range || 1);

            if (height <= minHeight + 15) {
                sheetTitle.style.opacity = '1';
                sheetContent.style.opacity = '0';
                sheetContent.style.pointerEvents = 'none';
            } else {
                sheetTitle.style.opacity = '0';
                sheetContent.style.opacity = '1';
                sheetContent.style.pointerEvents = 'auto';
            }
        }

        function checkAndResetSheet() {
            const currentH = bottomSheet.clientHeight;
            const initialH = getInitialHeight();
            const threshold = initialH * 0.3;

            if (currentH < threshold) {
                bottomSheet.style.transition = 'height 0.25s ease-out';
                bottomSheet.style.height = initialH + 'px';
                updateSheetState(initialH);
            }
        }

        function enableHorizontalDrag(containerId) {
            const slider = document.getElementById(containerId);
            if (!slider) return;
            let isDown = false;
            let startX, scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        window.addEventListener('resize', () => {
            if (bottomSheet.clientHeight > minHeight + 15) {
                const max = getMaxHeight();
                if (bottomSheet.clientHeight > max) {
                    bottomSheet.style.height = max + 'px';
                }
            }
            if (window.innerWidth > 500) {
                snapPhoneToBoundaries();
            }

        function loadTabContent(tabName) {
            const data = tabData[tabName];
            if (!data) return;

            sideMenu.innerHTML = '';
            data.sideButtons.forEach((btnData, index) => {
                const button = document.createElement('button');
                button.className = `side-item ${index === 0 ? 'active' : ''}`;
                button.onclick = function() { 
                    selectSideOption(this); 
                };
                button.innerHTML = `
                    <div class="side-icon-wrapper"><svg viewBox="0 0 24 24">${btnData.icon}</svg></div>
                    ${btnData.label}
                `;
                sideMenu.appendChild(button);
            });

            sheetContent.innerHTML = data.sheetHTML;

            setTimeout(() => {
                enableHorizontalDrag('stylesScroll');
                enableHorizontalDrag('colorsScroll');
                enableHorizontalDrag('bustoScroll');
                enableHorizontalDrag('pernasScroll');
                enableHorizontalDrag('pesScroll');
                enableHorizontalDrag('estiloScroll');
                enableHorizontalDrag('gravacaoScroll');
            }, 50);
        }

        function selectSideOption(el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            checkAndResetSheet();
        }

        function selectStyle(el) {
            document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function selectColor(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function selectFooterTab(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const tabName = el.getAttribute('data-tab');
            loadTabContent(tabName);
            checkAndResetSheet();
        }

        loadTabContent("Aparência");
    </script>
