<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizador de Avatar Dinâmico</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-container: #1a181f;
            --bg-sheet: #14141b;
            --bg-card: #27242b;
            --bg-pill: #1b1b21;
            --primary: #c96b7c;
            --text-main: #ffffff;
            --text-secondary: #8c8891;
            --text-muted: #b0acb8;
            --border-color: #26242f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            max-height: 960px;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 40px;
                border: 1px solid var(--border-color);
            }
        }

        .viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            bottom: 84px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #382e3f 0%, #17151b 75%);
            overflow: hidden;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            position: absolute;
            bottom: 0;
        }

        .side-menu {
            position: absolute;
            right: 12px;
            top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            max-height: calc(100% - 120px);
            overflow-y: auto;
            scrollbar-width: none;
            padding: 4px 0;
        }

        .side-menu::-webkit-scrollbar {
            display: none;
        }

        .side-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            gap: 3px;
            transition: color 0.2s;
        }

        .side-item.active {
            color: var(--primary);
        }

        .side-icon-wrapper {
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-icon-wrapper svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer-nav {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            z-index: 40;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .footer-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
            flex: 0 0 calc((100% - (4 * 8px)) / 5);
            min-width: 58px;
            white-space: nowrap;
        }

        @media (max-width: 360px) {
            .nav-item {
                flex: 0 0 62px;
            }
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon-wrapper {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 84px;
            left: 0;
            width: 100%;
            background-color: var(--bg-sheet);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 10px 16px 16px 16px;
            z-index: 30;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-header-area {
            width: 100%;
            cursor: pointer;
            padding: 4px 0 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .sheet-handle {
            width: 42px;
            height: 6px;
            background-color: #5c5765;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .sheet-header-area:hover .sheet-handle,
        .sheet-header-area:active .sheet-handle,
        .sheet-handle.active-pink {
            background-color: var(--primary);
        }

        .sheet-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .sheet-content {
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            opacity: 1;
            transition: opacity 0.15s ease;
        }

        .sheet-content::-webkit-scrollbar {
            display: none;
        }

        .sheet-content > * {
            flex-shrink: 0;
        }

        .section-title {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section-divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .styles-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .styles-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .style-card {
            background-color: var(--bg-card); 
            border: 2px solid transparent;
            border-radius: 16px;
            min-width: 74px;
            height: 84px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .style-card.active {
            border-color: var(--primary);
        }

        .style-card span {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            pointer-events: none;
        }

        .colors-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .colors-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .color-dot {
            min-width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .color-dot.active {
            border-color: var(--primary);
            padding: 2px;
        }
    </style>
</head>

    <script>
        const bottomSheet = document.getElementById('bottomSheet');
        const sheetHeader = document.getElementById('sheetHeader');
        const sheetContent = document.getElementById('sheetContent');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetHandle = document.getElementById('sheetHandle');
        const appContainer = document.getElementById('appContainer');
        const sideMenu = document.getElementById('sideMenu');

        let isDragging = false;
        let startY = 0;
        let startHeight = 0;
        let hasMoved = false; 
        const minHeight = 44; 

        function getMaxHeight() { 
            return appContainer.clientHeight - 130; 
        }
        function getInitialHeight() { 
            return appContainer.clientHeight * 0.32; 
        }

        let currentHeight = getInitialHeight();
        bottomSheet.style.height = currentHeight + 'px';
        updateSheetState(currentHeight);

        sheetHeader.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        sheetHeader.addEventListener('touchstart', startDrag, {passive: true});
        window.addEventListener('touchmove', onDrag, {passive: true});
        window.addEventListener('touchend', stopDrag);

        sheetHeader.addEventListener('click', (e) => {
            if (hasMoved) return;

            bottomSheet.style.transition = 'height 0.25s ease-out';
            if (bottomSheet.clientHeight <= minHeight + 15) {
                let targetH = getInitialHeight();
                bottomSheet.style.height = targetH + 'px';
                updateSheetState(targetH);
            } else {
                bottomSheet.style.height = minHeight + 'px';
                updateSheetState(minHeight);
            }
        });

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            sheetHandle.classList.add('active-pink'); 
            startY = e.clientY || e.touches[0].clientY;
            startHeight = bottomSheet.clientHeight;
            bottomSheet.style.transition = 'none';
        }

        function onDrag(e) {
            if (!isDragging) return;
            hasMoved = true; 
            const currentY = e.clientY || e.touches[0].clientY;
            const diff = startY - currentY; 
            let newHeight = startHeight + diff;
            const max = getMaxHeight();
            if (newHeight < minHeight) newHeight = minHeight;
            if (newHeight > max) newHeight = max;

            bottomSheet.style.height = newHeight + 'px';
            updateSheetState(newHeight);
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            sheetHandle.classList.remove('active-pink'); 
            bottomSheet.style.transition = 'height 0.2s ease-out';
        }

        function updateSheetState(height) {
            const max = getMaxHeight();
            const range = max - minHeight;
            const progress = (height - minHeight) / (range || 1);

            if (height <= minHeight + 15) {
                sheetTitle.style.opacity = '1';
                sheetContent.style.opacity = '0';
                sheetContent.style.pointerEvents = 'none';
            } else {
                sheetTitle.style.opacity = '0';
                sheetContent.style.opacity = '1';
                sheetContent.style.pointerEvents = 'auto';
            }
        }

        function checkAndResetSheet() {
            const currentH = bottomSheet.clientHeight;
            const initialH = getInitialHeight();
            const threshold = initialH * 0.3; // 30% da altura inicial

            // Se estiver abaixo de 30% da altura inicial, volta para a altura padrão
            if (currentH < threshold) {
                bottomSheet.style.transition = 'height 0.25s ease-out';
                bottomSheet.style.height = initialH + 'px';
                updateSheetState(initialH);
            }
            // Se estiver acima ou igual a 30%, permanece exatamente na mesma altura atual
        }

        function enableHorizontalDrag(containerId) {
            const slider = document.getElementById(containerId);
            if (!slider) return;
            let isDown = false;
            let startX, scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

            },
            "Estilo": {
                sideButtons: [
                    { label: "Roupas", active: true, icon: '<path d="M12,3L2,12H5V20H19V12H22L12,3M12,7.7C14.1,7.7 15.8,9.4 15.8,11.5C15.8,13.6 14.1,15.3 12,15.3C9.9,15.3 8.2,13.6 8.2,11.5C8.2,9.4 9.9,7.7 12,7.7Z"/>' },
                    { label: "Acessórios", active: false, icon: '<path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12C4,13.85 4.63,15.55 5.68,16.91C6.7,15.5 8.5,14.5 12,14.5C15.5,14.5 17.3,15.5 18.32,16.91C19.37,15.55 20,13.85 20,12A8,8 0 0,0 12,4Z"/>' }
                ],
                sheetHTML: `
                    <div class="section-title">Guarda-Roupa</div>
                    <div class="styles-scroll-container" id="estiloScroll">
                        <div class="style-card active" onclick="selectStyle(this)"><span>Casual</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Social</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Esportivo</span></div>
                    </div>
                `
            },
            "Gravação": {
                sideButtons: [
                    { label: "Câmera", active: true, icon: '<path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/>' }
                ],
                sheetHTML: `
                    <div class="section-title">Opções de Gravação</div>
                    <div class="styles-scroll-container" id="gravacaoScroll">
                        <div class="style-card active" onclick="selectStyle(this)"><span>Foto 360</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Vídeo Padrão</span></div>
                    </div>
                `
            }
        };

        function loadTabContent(tabName) {
            const data = tabData[tabName];
            if (!data) return;

            sideMenu.innerHTML = '';
            data.sideButtons.forEach((btnData, index) => {
                const button = document.createElement('button');
                button.className = `side-item ${index === 0 ? 'active' : ''}`;
                button.onclick = function() { 
                    selectSideOption(this); 
                };
                button.innerHTML = `
                    <div class="side-icon-wrapper"><svg viewBox="0 0 24 24">${btnData.icon}</svg></div>
                    ${btnData.label}
                `;
                sideMenu.appendChild(button);
            });

            sheetContent.innerHTML = data.sheetHTML;

            setTimeout(() => {
                enableHorizontalDrag('stylesScroll');
                enableHorizontalDrag('colorsScroll');
                enableHorizontalDrag('bustoScroll');
                enableHorizontalDrag('pernasScroll');
                enableHorizontalDrag('pesScroll');
                enableHorizontalDrag('estiloScroll');
                enableHorizontalDrag('gravacaoScroll');
            }, 50);
        }

        function selectSideOption(el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            checkAndResetSheet();
        }

        function selectStyle(el) {
            document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function selectColor(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function selectFooterTab(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const tabName = el.getAttribute('data-tab');
            loadTabContent(tabName);
            checkAndResetSheet();
        }

        loadTabContent("Aparência");
    </script>
</body>
</html>
