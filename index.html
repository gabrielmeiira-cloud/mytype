<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customizador de Avatar Dinâmico</title>
    <style>
        :root {
            --bg-main: #0c0b0e;
            --bg-container: #1a181f;
            --bg-sheet: #14141b;
            --bg-card: #27242b;
            --bg-pill: #1b1b21;
            --primary: #c96b7c;
            --text-main: #ffffff;
            --text-secondary: #8c8891;
            --text-muted: #b0acb8;
            --border-color: #26242f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .phone-movable-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        .app-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Desktop: Janela Móvel e Botões Circulares Sobrepostos nas Quinas */
        @media (min-width: 501px) {
            body {
                background: radial-gradient(circle at center, #1b1922 0%, #0c0b0e 100%);
            }

            .phone-wrapper {
                padding: 20px;
            }

            .app-container {
                width: 350px;
                height: calc(100vh - 28px);
                max-height: 94vh;
                border-radius: 34px;
                border: 2px solid var(--border-color);
                box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
                position: relative;
            }

            /* Botão de Mover Circular Sobreposto na Quina Superior Esquerda */
            .window-btn-drag {
                position: absolute;
                top: -14px;
                left: -14px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #232029;
                border: 2px solid rgba(255, 255, 255, 0.2);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: grab;
                z-index: 90;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
                transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
                touch-action: none;
            }

            .window-btn-drag:hover {
                background-color: #382c33;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.12);
                box-shadow: 0 8px 24px rgba(201, 107, 124, 0.45);
            }

            .window-btn-drag:active {
                cursor: grabbing;
                transform: scale(0.95);
            }

            .window-btn-drag svg {
                width: 17px;
                height: 17px;
                fill: currentColor;
                pointer-events: none;
            }

            /* Botão de Minimizar Circular Sobreposto na Quina Superior Direita */
            .window-btn-minimize {
                position: absolute;
                top: -14px;
                right: -14px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #232029;
                border: 2px solid rgba(255, 255, 255, 0.2);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 90;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
                transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            }

            .window-btn-minimize:hover {
                background-color: #382c33;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.12);
                box-shadow: 0 8px 24px rgba(201, 107, 124, 0.45);
            }

            .window-btn-minimize:active {
                transform: scale(0.95);
            }

            .window-btn-minimize svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
                pointer-events: none;
            }
        }

        /* Celular Físico: Ocupa 100% da tela e altura do navegador */
        @media (max-width: 500px) {
            .phone-wrapper,
            .phone-movable-frame {
                width: 100%;
                height: 100%;
                padding: 0;
                transform: none !important;
            }

            .app-container {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .window-btn-drag,
            .window-btn-minimize,
            .floating-mini-phone {
                display: none !important;
            }
        }

        /* Celularzinho em miniatura suspenso quando minimizado */
        .floating-mini-phone {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px;
            height: 96px;
            border-radius: 16px;
            background-color: #121118;
            border: 2px solid var(--primary);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(201, 107, 124, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.3) rotate(-15deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, box-shadow 0.2s;
            padding: 3px;
        }

        .floating-mini-phone.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) rotate(0deg);
            animation: miniPhoneFloat 3.5s ease-in-out infinite alternate;
        }

        .floating-mini-phone:hover {
            transform: scale(1.15) rotate(4deg) !important;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 35px rgba(201, 107, 124, 0.7);
            border-color: #ffffff;
        }

        .mini-phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--bg-container);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-phone-notch {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            z-index: 5;
        }

        .mini-phone-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            pointer-events: none;
        }

        .mini-phone-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #25d366;
            border: 1.5px solid var(--bg-container);
            box-shadow: 0 0 6px rgba(37, 211, 102, 0.9);
            z-index: 6;
        }

        .mini-phone-bar {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            z-index: 5;
        }

        @keyframes miniPhoneFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Viewport / Canvas Interativo com Câmera Virtual */
        .viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            bottom: 74px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #17151b;
            overflow: hidden;
            z-index: 1;
            cursor: grab;
            touch-action: none;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
        }

        /* Degradê que se move junto com o enquadramento e a modelo */
        .avatar-bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300%;
            height: 300%;
            background: radial-gradient(circle at center, #3d3146 0%, rgba(45, 36, 52, 0.6) 35%, rgba(23, 21, 27, 0.95) 65%, #17151b 100%);
            pointer-events: none;
            z-index: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            position: absolute;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Marcador de Zoom e Coordenadas da Câmera em Tempo Real (HUD) */
        .camera-hud-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(20, 18, 26, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 5px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 20;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        }

        .camera-hud-badge:hover {
            background: rgba(35, 30, 42, 0.92);
            border-color: var(--primary);
            transform: scale(1.03);
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .hud-row svg {
            width: 11px;
            height: 11px;
            fill: var(--primary);
        }

        .hud-sub {
            font-size: 8.5px;
            color: var(--text-muted);
            font-family: monospace, sans-serif;
            letter-spacing: -0.2px;
        }

        .side-menu {
            position: absolute;
            right: 10px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 25;
            max-height: calc(100% - 100px);
            overflow-y: auto;
            scrollbar-width: none;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
        }

        .side-menu::-webkit-scrollbar {
            display: none;
        }

        .side-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            gap: 2px;
            transition: color 0.2s;
        }

        .side-item.active {
            color: var(--primary);
        }

        .side-icon-wrapper {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-icon-wrapper svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .footer-nav {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 8px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            z-index: 40;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .footer-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            transition: color 0.2s;
            flex: 0 0 calc((100% - (4 * 6px)) / 5);
            min-width: 50px;
            white-space: nowrap;
        }

        @media (max-width: 360px) {
            .nav-item {
                flex: 0 0 54px;
            }
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon-wrapper {
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon-wrapper svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 74px;
            left: 0;
            width: 100%;
            background-color: var(--bg-sheet);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 8px 14px 14px 14px;
            z-index: 30;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-header-area {
            width: 100%;
            cursor: pointer;
            padding: 4px 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            touch-action: none;
        }

        .sheet-handle {
            width: 36px;
            height: 5px;
            background-color: #5c5765;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .sheet-header-area:hover .sheet-handle,
        .sheet-header-area:active .sheet-handle,
        .sheet-handle.active-pink {
            background-color: var(--primary);
        }

        .sheet-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .sheet-content {
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            opacity: 1;
            transition: opacity 0.15s ease;
            -webkit-overflow-scrolling: touch;
        }

        .sheet-content::-webkit-scrollbar {
            display: none;
        }

        .sheet-content > * {
            flex-shrink: 0;
        }

        .section-title {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .section-divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .styles-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .styles-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .style-card {
            background-color: var(--bg-card); 
            border: 2px solid transparent;
            border-radius: 14px;
            min-width: 68px;
            height: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .style-card.active {
            border-color: var(--primary);
        }

        .style-card span {
            font-size: 9.5px;
            color: var(--text-muted);
            white-space: nowrap;
            pointer-events: none;
        }

        .colors-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .colors-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .color-dot {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .color-dot.active {
            border-color: var(--primary);
            padding: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper" id="phoneWrapper">
        <div class="phone-movable-frame" id="phoneMovableFrame">
            
            <!-- Botão de Arrastar Circular (Sobreposto na Quina Superior Esquerda) -->
            <div class="window-btn-drag" id="windowDragHandle" title="Clique e segure para arrastar a janela">
                <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
            </div>

            <!-- Botão de Minimizar Circular (Sobreposto na Quina Superior Direita) -->
            <button class="window-btn-minimize" id="btnMinimize" title="Minimizar (vira celularzinho no canto)" aria-label="Minimizar">
                <svg viewBox="0 0 24 24"><path d="M19,13H5V11H19V13Z"/></svg>
            </button>

            <div class="app-container" id="appContainer">
                
                <!-- Viewport / Canvas com Câmera Virtual Sobre a Modelo -->
                <div class="viewport" id="viewportCanvas">
                    
                    <!-- Marcador de Zoom e Posição da Câmera em Tempo Real (HUD) -->
                    <div class="camera-hud-badge" id="cameraHudBadge" title="Clique para copiar os valores da câmera">
                        <div class="hud-row">
                            <svg viewBox="0 0 24 24"><path d="M15.5,14L20.5,19L19,20.5L14,15.5V14.71L13.73,14.43C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.43,13.73L14.71,14H15.5M9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14M12,10H10V12H9V10H7V9H9V7H10V9H12V10Z"/></svg>
                            <span id="zoomLevelText">Zoom: 90%</span>
                        </div>
                        <div class="hud-sub" id="coordsText">Cam: X: 0 | Y: 0</div>
                    </div>

                    <div class="avatar-container" id="avatarContainer">
                        <div class="avatar-bg-glow"></div>
                        <img src="avatar.png" alt="Avatar Model" class="avatar-img" id="avatarImg">
                    </div>
                </div>

                <div class="side-menu" id="sideMenu"></div>

                <div class="bottom-sheet" id="bottomSheet">
                    <div class="sheet-header-area" id="sheetHeader">
                        <div class="sheet-handle" id="sheetHandle"></div>
                        <div class="sheet-title" id="sheetTitle">Configurações</div>
                    </div>
                    
                    <div class="sheet-content" id="sheetContent"></div>
                </div>

                <div class="footer-nav" id="footerNav">
                    <button class="nav-item" data-tab="Identidade" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg></div>
                        Identidade
                    </button>
                    <button class="nav-item active" data-tab="Aparência" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,2C9.24,2 7,4.24 7,7C7,8.87 8.03,10.5 9.58,11.36C6.61,12.43 4.5,15.28 4.5,18.5C4.5,18.78 4.72,19 5,19H19C19.28,19 19.5,18.78 19.5,18.5C19.5,15.28 17.39,12.43 14.42,11.36C15.97,10.5 17,8.87 17,7C17,4.24 14.76,2 12,2M12,4C13.66,4 15,5.34 15,7C15,8.66 13.66,10 12,10C10.34,10 9,8.66 9,7C9,5.34 10.34,4 12,4M12,13C15.03,13 17.5,15.47 17.5,18.5H6.5C6.5,15.47 8.97,13 12,13Z"/></svg></div>
                        Aparência
                    </button>
                    <button class="nav-item" data-tab="Busto" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5A3,3 0 0,1 12,8A3,3 0 0,1 9,5A3,3 0 0,1 12,2M12,10C14.67,10 20,11.34 20,14V16H4V14C4,11.34 9.33,10 12,10Z"/></svg></div>
                        Busto
                    </button>
                    <button class="nav-item" data-tab="Pernas" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M9,2H15V6H9V2M11,8H13V13H11V8M10,14H14V22H12V17H10V14Z"/></svg></div>
                        Pernas
                    </button>
                    <button class="nav-item" data-tab="Pés" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/></svg></div>
                        Pés
                    </button>
                    <button class="nav-item" data-tab="Estilo" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M12,3L2,12H5V20H19V12H22L12,3M12,7.7C14.1,7.7 15.8,9.4 15.8,11.5C15.8,13.6 14.1,15.3 12,15.3C9.9,15.3 8.2,13.6 8.2,11.5C8.2,9.4 9.9,7.7 12,7.7Z"/></svg></div>
                        Estilo
                    </button>
                    <button class="nav-item" data-tab="Gravação" onclick="selectFooterTab(this)">
                        <div class="nav-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/></svg></div>
                        Gravação
                    </button>
                </div>

        <div class="mini-phone-screen">
            <div class="mini-phone-notch"></div>
            <img src="avatar.png" alt="My Type" class="mini-phone-avatar">

    <script>
        const bottomSheet = document.getElementById('bottomSheet');
        const sheetHeader = document.getElementById('sheetHeader');
        const sheetContent = document.getElementById('sheetContent');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetHandle = document.getElementById('sheetHandle');
        const appContainer = document.getElementById('appContainer');
        const phoneMovableFrame = document.getElementById('phoneMovableFrame');
        const sideMenu = document.getElementById('sideMenu');
        const windowDragHandle = document.getElementById('windowDragHandle');
        const btnMinimize = document.getElementById('btnMinimize');
        const floatingBubble = document.getElementById('floatingBubble');
        const viewportCanvas = document.getElementById('viewportCanvas');
        const avatarContainer = document.getElementById('avatarContainer');
        const zoomLevelText = document.getElementById('zoomLevelText');
        const coordsText = document.getElementById('coordsText');
        const cameraHudBadge = document.getElementById('cameraHudBadge');

        /* --- CONTROLE DA CÂMERA SOBRE A MODELO FIXA --- */
        const DEFAULT_SCALE = 0.9;
        const MIN_SCALE = 0.55;
        const MAX_SCALE = 3.5;

        let cameraZoom = DEFAULT_SCALE;
        let cameraX = 0;
        let cameraY = 0;
        let isCameraAnimating = false;

        /* --- LIMITE DE 20% NO GERAL --- */
        function getCameraBounds(zoom) {
            const vW = (viewportCanvas && viewportCanvas.clientWidth) ? viewportCanvas.clientWidth : 350;
            const vH = (viewportCanvas && viewportCanvas.clientHeight) ? viewportCanvas.clientHeight : 500;

            // Limite de 20% no geral
            const maxX = Math.max(50, (vW * 0.5) * zoom * 0.20);
            const maxY = Math.max(80, (vH * 0.5) * zoom * 0.20);

            return {
                minX: -maxX,
                maxX: maxX,
                minY: -maxY,
                maxY: maxY
            };
        }

        function clampVal(val, min, max, elastic = false) {
            if (val < min) {
                return elastic ? min + (val - min) * 0.35 : min;
            }
            if (val > max) {
                return elastic ? max + (val - max) * 0.35 : max;
            }
            return val;
        }

        function snapCameraToBounds(smooth = true) {
            const bounds = getCameraBounds(cameraZoom);
            const clampedX = clampVal(cameraX, bounds.minX, bounds.maxX, false);
            const clampedY = clampVal(cameraY, bounds.minY, bounds.maxY, false);

            if (clampedX !== cameraX || clampedY !== cameraY) {
                cameraX = clampedX;
                cameraY = clampedY;
                applyCameraTransform(smooth);
            }
        }

        function applyCameraTransform(smooth = false) {
            if (smooth) {
                avatarContainer.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            } else {
                avatarContainer.style.transition = 'none';
            }
            avatarContainer.style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${cameraZoom})`;
            updateCameraHud();
        }

        function updateCameraHud() {
            if (zoomLevelText) {
                zoomLevelText.innerText = `Zoom: ${Math.round(cameraZoom * 100)}%`;
            }
            if (coordsText) {
                coordsText.innerText = `Cam: X: ${Math.round(cameraX)} | Y: ${Math.round(cameraY)}`;
            }
        }

        // Anima a Câmera para focar na parte do corpo desejada
        function animateCameraView(targetZoom, targetX, targetY, duration = 460) {
            isCameraAnimating = true;
            cameraZoom = Math.min(MAX_SCALE, Math.max(MIN_SCALE, targetZoom));
            const bounds = getCameraBounds(cameraZoom);
            cameraX = clampVal(targetX, bounds.minX, bounds.maxX, false);
            cameraY = clampVal(targetY, bounds.minY, bounds.maxY, false);

            avatarContainer.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
            avatarContainer.style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${cameraZoom})`;
            updateCameraHud();

            setTimeout(() => {
                isCameraAnimating = false;
                avatarContainer.style.transition = 'none';
            }, duration);
        }

        // Presets de Câmera por Abas
        const cameraPresets = {
            "Aparência": { scale: 2.15, x: 0, y: 200 },   // Foco no rosto
            "Identidade": { scale: 0.9, x: 0, y: 0 },     // Padrão 90%
            "Busto": { scale: 1.8, x: 0, y: 85 },         // 180%
            "Pernas": { scale: 1.75, x: 0, y: -140 },     // 175%
            "Pés": { scale: 1.9, x: 0, y: -220 },         // Foco nos pés
            "Estilo": { scale: 1.1, x: 0, y: 20 },        // Moda
            "Gravação": { scale: 0.9, x: 0, y: 0 }        // Estúdio
        };

        // Copiar coordenadas da câmera ao clicar no HUD
        if (cameraHudBadge) {
            cameraHudBadge.addEventListener('click', (e) => {
                e.stopPropagation();
                const textToCopy = `Zoom: ${Math.round(cameraZoom * 100)}%, X: ${Math.round(cameraX)}, Y: ${Math.round(cameraY)}`;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(textToCopy);
                }
                const originalText = coordsText.innerText;
                coordsText.innerText = "Copiado!";
                setTimeout(() => {
                    coordsText.innerText = originalText;
                }, 1000);
            });
        }

        /* --- ZOOM DA CÂMERA COM O SCROLL DO MOUSE (FOCO NO CURSOR) --- */
        if (viewportCanvas) {
            viewportCanvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                isCameraAnimating = false;
                avatarContainer.style.transition = 'none';

                const rect = viewportCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;

                const zoomFactor = e.deltaY < 0 ? 1.14 : 0.88;
                const newZoom = Math.min(MAX_SCALE, Math.max(MIN_SCALE, cameraZoom * zoomFactor));

                if (newZoom !== cameraZoom) {
                    let nextCamX = mouseX - (mouseX - cameraX) * (newZoom / cameraZoom);
                    let nextCamY = mouseY - (mouseY - cameraY) * (newZoom / cameraZoom);
                    
                    const bounds = getCameraBounds(newZoom);
                    cameraX = clampVal(nextCamX, bounds.minX, bounds.maxX, false);
                    cameraY = clampVal(nextCamY, bounds.minY, bounds.maxY, false);
                    cameraZoom = newZoom;
                    applyCameraTransform(false);
                }
            }, { passive: false });
        }

        /* --- MOVIMENTAÇÃO DA CÂMERA SOBRE A MODELO COM CLIQUE / TOUCH --- */
        let isPanningCamera = false;
        let camStartX = 0;
        let camStartY = 0;
        let camInitialX = 0;
        let camInitialY = 0;

        let lastTapTime = 0;
        let initialPinchDist = 0;
        let initialPinchScale = cameraZoom;

        if (viewportCanvas) {
            viewportCanvas.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.side-menu') || e.target.closest('.bottom-sheet') || e.target.closest('.footer-nav') || e.target.closest('.camera-hud-badge')) return;

                isCameraAnimating = false;
                avatarContainer.style.transition = 'none';

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 280 && tapLength > 0) {
                    e.preventDefault();
                    if (cameraZoom > 1.3) {
                        animateCameraView(DEFAULT_SCALE, 0, 0, 400);
                    } else {
                        const rect = viewportCanvas.getBoundingClientRect();
                        const tapX = e.clientX - rect.left - rect.width / 2;
                        const tapY = e.clientY - rect.top - rect.height / 2;
                        animateCameraView(2.15, -tapX * 0.75, -tapY * 0.75, 400);
                    }
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = currentTime;

                isPanningCamera = true;
                camStartX = e.clientX;
                camStartY = e.clientY;
                camInitialX = cameraX;
                camInitialY = cameraY;

                try { 
                    if (viewportCanvas.setPointerCapture) viewportCanvas.setPointerCapture(e.pointerId); 
                } catch(err){}
            });

            viewportCanvas.addEventListener('pointermove', (e) => {
                if (!isPanningCamera) return;
                const rawX = camInitialX + (e.clientX - camStartX);
                const rawY = camInitialY + (e.clientY - camStartY);

                const bounds = getCameraBounds(cameraZoom);
                cameraX = clampVal(rawX, bounds.minX, bounds.maxX, true);
                cameraY = clampVal(rawY, bounds.minY, bounds.maxY, true);
                applyCameraTransform(false);
            });

            viewportCanvas.addEventListener('pointerup', (e) => {
                if (!isPanningCamera) return;
                isPanningCamera = false;
                try { 
                    if (viewportCanvas.releasePointerCapture) viewportCanvas.releasePointerCapture(e.pointerId); 
                } catch(err){}
                snapCameraToBounds(true);
            });

            viewportCanvas.addEventListener('pointercancel', (e) => {
                isPanningCamera = false;
                snapCameraToBounds(true);
            });

            viewportCanvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialPinchScale = cameraZoom;
                }
            }, { passive: true });

            viewportCanvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDist > 0) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scaleFactor = currentDist / initialPinchDist;
                    const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, initialPinchScale * scaleFactor));
                    const bounds = getCameraBounds(nextScale);
                    cameraZoom = nextScale;
                    cameraX = clampVal(cameraX, bounds.minX, bounds.maxX, false);
                    cameraY = clampVal(cameraY, bounds.minY, bounds.maxY, false);
                    applyCameraTransform(false);
                }
            }, { passive: true });
        }

        /* --- CONTROLE DE ARRASTE DA JANELA (BOTÃO MOVER NO DESKTOP) --- */
        let isPhoneDragging = false;
        let phonePosX = 0;
        let phonePosY = 0;
        let phoneDragStartX = 0;
        let phoneDragStartY = 0;
        let phoneInitialX = 0;
        let phoneInitialY = 0;

        if (windowDragHandle) {
            windowDragHandle.addEventListener('pointerdown', (e) => {
                if (window.innerWidth <= 500) return;
                e.preventDefault();
                e.stopPropagation();

                isPhoneDragging = true;
                phoneDragStartX = e.clientX;
                phoneDragStartY = e.clientY;
                phoneInitialX = phonePosX;
                phoneInitialY = phonePosY;

                phoneMovableFrame.style.transition = 'none';
                try { windowDragHandle.setPointerCapture(e.pointerId); } catch(err) {}
            });

            windowDragHandle.addEventListener('pointermove', (e) => {
                if (!isPhoneDragging) return;
                phonePosX = phoneInitialX + (e.clientX - phoneDragStartX);
                phonePosY = phoneInitialY + (e.clientY - phoneDragStartY);
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            });

            windowDragHandle.addEventListener('pointerup', (e) => {
                if (!isPhoneDragging) return;
                isPhoneDragging = false;
                try { windowDragHandle.releasePointerCapture(e.pointerId); } catch(err) {}
                snapPhoneToBoundaries();
            });

            windowDragHandle.addEventListener('pointercancel', (e) => {
                if (!isPhoneDragging) return;
                isPhoneDragging = false;
                snapPhoneToBoundaries();
            });
        }

        function snapPhoneToBoundaries() {
            if (window.innerWidth <= 500) return;

            const rect = appContainer.getBoundingClientRect();
            const pad = 16;
            let deltaX = 0;
            let deltaY = 0;

            if (rect.left < pad + 20) { 
                deltaX = (pad + 20) - rect.left;
            } else if (rect.right > window.innerWidth - pad - 20) { 
                deltaX = (window.innerWidth - pad - 20) - rect.right;
            }

            if (rect.top < pad + 20) {
                deltaY = (pad + 20) - rect.top;
            } else if (rect.bottom > window.innerHeight - pad) {
                deltaY = (window.innerHeight - pad) - rect.bottom;
            }

            if (deltaX !== 0 || deltaY !== 0) {
                phonePosX += deltaX;
                phonePosY += deltaY;
                phoneMovableFrame.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            }
        }

        /* --- MINIMIZAR / RESTAURAR MINI CELULAR --- */
        if (btnMinimize) {
            btnMinimize.addEventListener('click', (e) => {
                e.stopPropagation();
                minimizePhoneWindow();
            });
        }

        function minimizePhoneWindow() {
            phoneMovableFrame.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY + 60}px) scale(0.25)`;
            phoneMovableFrame.style.opacity = '0';
            phoneMovableFrame.style.pointerEvents = 'none';

            setTimeout(() => {
                floatingBubble.classList.add('visible');
            }, 180);
        }

        function restorePhoneWindow() {
            floatingBubble.classList.remove('visible');

            phoneMovableFrame.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease';
            phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px) scale(1)`;
            phoneMovableFrame.style.opacity = '1';
            phoneMovableFrame.style.pointerEvents = 'auto';

            setTimeout(() => {
                snapPhoneToBoundaries();
            }, 420);
        }

        /* --- BOTTOM SHEET DRAG & STATE --- */
        let isDraggingSheet = false;
        let sheetStartY = 0;
        let sheetStartHeight = 0;
        let sheetHasMoved = false; 
        const minHeight = 40; 

        function getMaxHeight() { 
            return appContainer.clientHeight - 110; 
        }
        function getInitialHeight() { 
            return Math.max(140, Math.min(appContainer.clientHeight * 0.32, 280)); 
        }

        let currentHeight = getInitialHeight();
        bottomSheet.style.height = currentHeight + 'px';
        updateSheetState(currentHeight);

        sheetHeader.addEventListener('pointerdown', (e) => {
            isDraggingSheet = true;
            sheetHasMoved = false;
            sheetHandle.classList.add('active-pink'); 
            sheetStartY = e.clientY;
            sheetStartHeight = bottomSheet.clientHeight;
            bottomSheet.style.transition = 'none';
            try { sheetHeader.setPointerCapture(e.pointerId); } catch(err){}
        });

        sheetHeader.addEventListener('pointermove', (e) => {
            if (!isDraggingSheet) return;
            const diff = sheetStartY - e.clientY;
            if (Math.abs(diff) > 4) sheetHasMoved = true;
            let newHeight = sheetStartHeight + diff;
            const max = getMaxHeight();
            if (newHeight < minHeight) newHeight = minHeight;
            if (newHeight > max) newHeight = max;

            bottomSheet.style.height = newHeight + 'px';
            updateSheetState(newHeight);
        });

        sheetHeader.addEventListener('pointerup', (e) => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            sheetHandle.classList.remove('active-pink'); 
            bottomSheet.style.transition = 'height 0.2s ease-out';
            try { sheetHeader.releasePointerCapture(e.pointerId); } catch(err){}

            if (!sheetHasMoved) {
                if (bottomSheet.clientHeight <= minHeight + 15) {
                    let targetH = getInitialHeight();
                    bottomSheet.style.height = targetH + 'px';
                    updateSheetState(targetH);
                } else {
                    bottomSheet.style.height = minHeight + 'px';
                    updateSheetState(minHeight);
                }
            }
        });

        sheetHeader.addEventListener('pointercancel', (e) => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            sheetHandle.classList.remove('active-pink'); 
            bottomSheet.style.transition = 'height 0.2s ease-out';
        });

        function updateSheetState(height) {
            const max = getMaxHeight();
            const range = max - minHeight;
            const progress = (height - minHeight) / (range || 1);

            if (height <= minHeight + 15) {
                sheetTitle.style.opacity = '1';
                sheetContent.style.opacity = '0';
                sheetContent.style.pointerEvents = 'none';
            } else {
                sheetTitle.style.opacity = '0';
                sheetContent.style.opacity = '1';
                sheetContent.style.pointerEvents = 'auto';
            }
        }

        function checkAndResetSheet() {
            const currentH = bottomSheet.clientHeight;
            const initialH = getInitialHeight();
            const threshold = initialH * 0.3;

            if (currentH < threshold) {
                bottomSheet.style.transition = 'height 0.25s ease-out';
                bottomSheet.style.height = initialH + 'px';
                updateSheetState(initialH);
            }
        }

        function enableHorizontalDrag(containerId) {
            const slider = document.getElementById(containerId);
            if (!slider) return;
            let isDown = false;
            let startX, scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        window.addEventListener('resize', () => {
            if (bottomSheet.clientHeight > minHeight + 15) {
                const max = getMaxHeight();
                if (bottomSheet.clientHeight > max) {
                    bottomSheet.style.height = max + 'px';
                }
            }
            if (window.innerWidth > 500) {
                snapPhoneToBoundaries();
            }
        });

                    { label: "Olhos", active: false, icon: '<path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17C10.34,17 9,15.66 9,14C9,12.34 10.34,11 12,11C13.66,11 15,12.34 15,14C15,15.66 13.66,17 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>' },

            "Pés": {
                sideButtons: [
                    { label: "Tamanho", active: true, icon: '<path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/>' }
                ],
                sheetHTML: `
                    <div class="section-title">Calçados / Pés</div>
                    <div class="styles-scroll-container" id="pesScroll">
                        <div class="style-card active" onclick="selectStyle(this)"><span>Padrão</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Longo</span></div>

                `
            },
            "Estilo": {
                sideButtons: [
                    { label: "Roupas", active: true, icon: '<path d="M12,3L2,12H5V20H19V12H22L12,3M12,7.7C14.1,7.7 15.8,9.4 15.8,11.5C15.8,13.6 14.1,15.3 12,15.3C9.9,15.3 8.2,13.6 8.2,11.5C8.2,9.4 9.9,7.7 12,7.7Z"/>' },
                    { label: "Acessórios", active: false, icon: '<path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12C4,13.85 4.63,15.55 5.68,16.91C6.7,15.5 8.5,14.5 12,14.5C15.5,14.5 17.3,15.5 18.32,16.91C19.37,15.55 20,13.85 20,12A8,8 0 0,0 12,4M12,6A3,3 0 0,1 15,9A3,3 0 0,1 12,12A3,3 0 0,1 9,9A3,3 0 0,1 12,6Z"/>' }
                ],
                sheetHTML: `
                    <div class="section-title">Guarda-Roupa</div>
                    <div class="styles-scroll-container" id="estiloScroll">
                        <div class="style-card active" onclick="selectStyle(this)"><span>Casual</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Social</span></div>

                sideButtons: [
                    { label: "Câmera", active: true, icon: '<path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/>' }

                    <div class="section-title">Opções de Gravação</div>
                    <div class="styles-scroll-container" id="gravacaoScroll">
                        <div class="style-card active" onclick="selectStyle(this)"><span>Foto 360</span></div>
                        <div class="style-card" onclick="selectStyle(this)"><span>Vídeo Padrão</span></div>
                    </div>

            }
        };

        function loadTabContent(tabName) {
            const data = tabData[tabName];
            if (!data) return;

            sideMenu.innerHTML = '';
            data.sideButtons.forEach((btnData, index) => {
                const button = document.createElement('button');
                button.className = `side-item ${index === 0 ? 'active' : ''}`;
                button.onclick = function() { 
                    selectSideOption(this); 
                };
                button.innerHTML = `
                    <div class="side-icon-wrapper"><svg viewBox="0 0 24 24">${btnData.icon}</svg></div>
                    ${btnData.label}
                `;
                sideMenu.appendChild(button);
            });

            sheetContent.innerHTML = data.sheetHTML;

            // Anima a câmera para o preset correspondente da aba
            if (cameraPresets[tabName]) {
                const p = cameraPresets[tabName];
                animateCameraView(p.scale, p.x, p.y, 460);
            }

            setTimeout(() => {
                enableHorizontalDrag('stylesScroll');
                enableHorizontalDrag('colorsScroll');
                enableHorizontalDrag('bustoScroll');
                enableHorizontalDrag('pernasScroll');
                enableHorizontalDrag('pesScroll');
                enableHorizontalDrag('estiloScroll');
                enableHorizontalDrag('gravacaoScroll');
            }, 50);
        }

        function selectSideOption(el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            checkAndResetSheet();
        }

        function selectStyle(el) {
            document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function selectColor(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function selectFooterTab(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const tabName = el.getAttribute('data-tab');
            loadTabContent(tabName);
            checkAndResetSheet();
        }

        // Inicia carregando "Aparência"
        loadTabContent("Aparência");
    </script>
</body>
</html>
