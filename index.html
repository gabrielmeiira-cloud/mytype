<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customizador de Avatar Dinâmico</title>
    <style>
        :root {
            --bg-main: #0c0b0e;
            --bg-container: #1a181f;
            --bg-sheet: #14141b;
            --bg-card: #27242b;
            --bg-pill: #1b1b21;
            --primary: #c96b7c;
            --text-main: #ffffff;
            --text-secondary: #8c8891;
            --text-muted: #b0acb8;
            --border-color: #26242f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .phone-movable-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        .app-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Desktop: Janela Móvel e Botões Circulares Sobrepostos nas Quinas */
        @media (min-width: 501px) {
            body {
                background: radial-gradient(circle at center, #1b1922 0%, #0c0b0e 100%);
            }

            .phone-wrapper {
                padding: 20px;
            }

            .app-container {
                width: 350px;
                height: calc(100vh - 28px);
                max-height: 94vh;
                border-radius: 34px;
                border: 2px solid var(--border-color);
                box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
                position: relative;
            }

            /* Botão de Mover Circular Sobreposto na Quina Superior Esquerda */
            .window-btn-drag {
                position: absolute;
                top: -14px;
                left: -14px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #232029;
                border: 2px solid rgba(255, 255, 255, 0.2);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: grab;
                z-index: 90;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
                transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
                touch-action: none;
            }

            .window-btn-drag:hover {
                background-color: #382c33;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.12);
                box-shadow: 0 8px 24px rgba(201, 107, 124, 0.45);
            }

            .window-btn-drag:active {
                cursor: grabbing;
                transform: scale(0.95);
            }

            .window-btn-drag svg {
                width: 17px;
                height: 17px;
                fill: currentColor;
                pointer-events: none;
            }

            /* Botão de Minimizar Circular Sobreposto na Quina Superior Direita */
            .window-btn-minimize {
                position: absolute;
                top: -14px;
                right: -14px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #232029;
                border: 2px solid rgba(255, 255, 255, 0.2);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 90;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
                transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            }

            .window-btn-minimize:hover {
                background-color: #382c33;
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.12);
                box-shadow: 0 8px 24px rgba(201, 107, 124, 0.45);
            }

            .window-btn-minimize:active {
                transform: scale(0.95);
            }

            .window-btn-minimize svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
                pointer-events: none;
            }

        }

        /* Celular Físico: Ocupa 100% da tela e altura do navegador */
        @media (max-width: 500px) {
            .phone-wrapper,
            .phone-movable-frame {
                width: 100%;
                height: 100%;
                padding: 0;
                transform: none !important;
            }

            .app-container {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .window-btn-drag,
            .window-btn-minimize,
            .floating-mini-phone,
            .desktop-debug-wrapper {
                display: none !important;
            }
        }

        /* Celularzinho em miniatura suspenso quando minimizado */
        .floating-mini-phone {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px;
            height: 96px;
            border-radius: 16px;
            background-color: #121118;
            border: 2px solid var(--primary);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(201, 107, 124, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.3) rotate(-15deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, box-shadow 0.2s;
            padding: 3px;
        }

        .floating-mini-phone.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) rotate(0deg);
            animation: miniPhoneFloat 3.5s ease-in-out infinite alternate;
        }

        .floating-mini-phone:hover {
            transform: scale(1.15) rotate(4deg) !important;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 35px rgba(201, 107, 124, 0.7);
            border-color: #ffffff;
        }

        .mini-phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--bg-container);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-phone-notch {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            z-index: 5;
        }

        .mini-phone-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            pointer-events: none;
        }

        .mini-phone-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #25d366;
            border: 1.5px solid var(--bg-container);
            box-shadow: 0 0 6px rgba(37, 211, 102, 0.9);
            z-index: 6;
        }

        .mini-phone-bar {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            z-index: 5;
        }

        @keyframes miniPhoneFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Viewport / Canvas Interativo */
        .viewport {
            position: absolute;
            top: 36px;
            left: 0;
            width: 100%;
            bottom: 74px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #17151b;
            overflow: hidden;
            z-index: 1;
            cursor: grab;
            touch-action: none;
            transition: background 0.3s ease, top 0.2s ease;
        }

        .viewport:active {
            cursor: grabbing;
        }

        /* Modo Fundo Antigo / Fixo */
        .viewport.mode-static-bg {
            background: radial-gradient(circle at center, #382e3f 0%, #17151b 75%) !important;
        }

        .viewport.mode-static-bg .infinite-gradient-backdrop {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            pointer-events: none;
            will-change: transform;
        }

        /* Clone exato do degradê 10x maior que se move junto com o avatar (Modo Câmera) */
        .infinite-gradient-backdrop {
            position: absolute;
            top: -450%;
            left: -450%;
            width: 1000%;
            height: 1000%;
            background: radial-gradient(circle at 50% 50%, #382e3f 0%, #17151b 7.5%, #17151b 100%);
            pointer-events: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .avatar-layer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            position: absolute;
            bottom: 0;
            left: 0;
            pointer-events: none;
            image-rendering: auto;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: opacity 0.25s ease, filter 0.3s ease;
        }

        .avatar-layer.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .avatar-base {
            z-index: 1;
        }

        #layerOutfit {
            z-index: 2;
        }

        #layerHair {
            z-index: 3;
        }

        /* Painel de Depuração Flutuante Externo (Apenas Computador - Fora do Canvas) */
        .desktop-debug-wrapper {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 999;
            align-items: flex-start;
        }

        .desktop-debug-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #232029;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .desktop-debug-btn:hover {
            background-color: #382c33;
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.12);
            box-shadow: 0 8px 24px rgba(201, 107, 124, 0.45);
        }

        .desktop-debug-btn.active {
            background-color: var(--primary);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(201, 107, 124, 0.8), 0 6px 18px rgba(0, 0, 0, 0.75);
            transform: scale(1.08);
        }

        .desktop-debug-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            pointer-events: none;
        }

        /* HUD e Painel de Depuração Externo */
        .camera-hud-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: 280px;
        }

        .camera-hud-group.debug-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .camera-hud-badge {
            background: rgba(20, 18, 26, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        .camera-hud-badge:hover {
            background: rgba(35, 30, 42, 0.95);
            border-color: var(--primary);
            transform: scale(1.01);
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .hud-row svg {
            width: 11px;
            height: 11px;
            fill: var(--primary);
        }

        .hud-sub {
            font-size: 8.5px;
            color: var(--text-muted);
            font-family: monospace, sans-serif;
            letter-spacing: -0.2px;
        }

        /* Botões de Ação do PIN */
        .pin-actions-row {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .pin-action-btn {
            background: rgba(26, 24, 34, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 8.5px;
            font-weight: 600;
            padding: 4px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .pin-action-btn:hover {
            background: var(--primary);
            border-color: #ffffff;
            transform: scale(1.03);
        }

        /* Botão para alternar entre Degradê Antigo (Fixo) e Degradê Novo (Câmera) */
        .bg-mode-btn {
            background: rgba(20, 18, 26, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 5px 9px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #ffffff;
            font-size: 9px;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            width: fit-content;
        }

        .bg-mode-btn:hover {
            background: rgba(35, 30, 42, 0.95);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .bg-mode-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--primary);
            flex-shrink: 0;
        }

        /* Barra de Sessões para Navegação Rápida */
        .debug-sessions-bar {
            background: rgba(20, 18, 26, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 5px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            max-width: 280px;
        }

        .debug-session-tag {
            font-size: 8.5px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #d1cdd9;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .debug-session-tag:hover,
        .debug-session-tag.active {
            background: var(--primary);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.04);
        }

        /* Caixa de Colisão / Bounding Box de Enquadramento */
        .debug-collision-box {
            position: absolute;
            border: 2px solid var(--primary);
            background: rgba(201, 107, 124, 0.18);
            box-shadow: 0 0 18px rgba(201, 107, 124, 0.45), inset 0 0 16px rgba(201, 107, 124, 0.2);
            z-index: 60;
            cursor: move;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            touch-action: none;
            box-sizing: border-box;
        }

        .debug-collision-box.debug-visible {
            opacity: 1;
            visibility: visible;
        }

        .debug-collision-box.is-locked {
            pointer-events: none !important;
            opacity: 0.55 !important;
            cursor: default !important;
            border-style: dotted !important;
        }

        .debug-collision-box.is-locked .box-handle {
            display: none !important;
        }

        .box-badge-tag {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 11, 14, 0.94);
            color: #ffffff;
            font-size: 8.5px;
            font-weight: 700;
            font-family: monospace;
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid var(--primary);
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .box-crosshair-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }

        .box-crosshair-center::before,
        .box-crosshair-center::after {
            content: '';
            position: absolute;
            background: var(--primary);
        }

        .box-crosshair-center::before {
            top: 50%;
            left: -4px;
            right: -4px;
            height: 1px;
            transform: translateY(-50%);
        }

        .box-crosshair-center::after {
            left: 50%;
            top: -4px;
            bottom: -4px;
            width: 1px;
            transform: translateX(-50%);
        }

        /* Alças de Redimensionamento dos Cantos e Bordas */
        .box-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            z-index: 70;
            box-sizing: border-box;
        }

        .box-handle.handle-nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .box-handle.handle-ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .box-handle.handle-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .box-handle.handle-se { bottom: -5px; right: -5px; cursor: nwse-resize; }

        .box-handle.handle-n  { top: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .box-handle.handle-s  { bottom: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .box-handle.handle-w  { left: -5px; top: calc(50% - 5px); cursor: ew-resize; }
        .box-handle.handle-e  { right: -5px; top: calc(50% - 5px); cursor: ew-resize; }

        /* Caixa de Colisão da Área Útil do Canvas (Colisor Azul de Enquadramento) */
        .debug-viewport-box {
            position: absolute;
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35), inset 0 0 20px rgba(56, 189, 248, 0.06);
            border-radius: 4px;
            pointer-events: auto;
            cursor: move;
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, border-color 0.2s ease;
            box-sizing: border-box;
            touch-action: none;
        }

        .debug-viewport-box.debug-visible {
            opacity: 1;
            visibility: visible;
        }

        .debug-viewport-box.is-locked {
            pointer-events: none !important;
            opacity: 0.55 !important;
            cursor: default !important;
            border-style: dotted !important;
        }

        .debug-viewport-box.is-locked .vp-handle {
            display: none !important;
        }

        .viewport-box-tag {
            position: absolute;
            top: 4px;
            left: 6px;
            background: rgba(12, 11, 14, 0.94);
            color: #38bdf8;
            font-size: 8px;
            font-weight: 700;
            font-family: monospace;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #38bdf8;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* Alças de Redimensionamento do Colisor Azul */
        .vp-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border: 2px solid #38bdf8;
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            z-index: 55;
            box-sizing: border-box;
        }

        .vp-handle.vp-handle-nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .vp-handle.vp-handle-ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .vp-handle.vp-handle-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .vp-handle.vp-handle-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .vp-handle.vp-handle-n  { top: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .vp-handle.vp-handle-s  { bottom: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .vp-handle.vp-handle-w  { left: -5px; top: calc(50% - 5px); cursor: ew-resize; }
        .vp-handle.vp-handle-e  { right: -5px; top: calc(50% - 5px); cursor: ew-resize; }

        /* Botões de Trava e Edição dos Colisores */
        .lock-toggles-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .btn-lock-toggle {
            flex: 1;
            font-size: 8.5px;
            font-weight: 700;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(25, 22, 32, 0.95);
            color: #d1cdd9;
            white-space: nowrap;
            user-select: none;
        }

        .btn-lock-toggle.btn-avatar-lock.unlocked {
            background: rgba(201, 107, 124, 0.28);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(201, 107, 124, 0.5);
        }

        .btn-lock-toggle.btn-viewport-lock.unlocked {
            background: rgba(56, 189, 248, 0.28);
            border-color: #38bdf8;

    <script>
        const bottomSheet = document.getElementById('bottomSheet');
        const sheetHeader = document.getElementById('sheetHeader');
        const sheetContent = document.getElementById('sheetContent');
        const sheetTitle = document.getElementById('sheetTitle');
        const sheetHandle = document.getElementById('sheetHandle');
        const appContainer = document.getElementById('appContainer');
        const phoneMovableFrame = document.getElementById('phoneMovableFrame');
        const sideMenu = document.getElementById('sideMenu');
        const windowDragHandle = document.getElementById('windowDragHandle');
        const btnMinimize = document.getElementById('btnMinimize');
        const floatingBubble = document.getElementById('floatingBubble');
        const viewportCanvas = document.getElementById('viewportCanvas');
        const avatarContainer = document.getElementById('avatarContainer');
        const zoomLevelText = document.getElementById('zoomLevelText');
        const coordsText = document.getElementById('coordsText');
        const bgModeLabel = document.getElementById('bgModeLabel');
        const infiniteBackdrop = document.getElementById('infiniteBackdrop');

        /* --- CONTROLE DE MODO DE DEGRADÊ (ANTIGO FIXO VS NOVO CÂMERA) --- */
        let isCameraBg = true; // Padrão: Câmera (Novo)

        function toggleBackgroundMode() {
            isCameraBg = !isCameraBg;
            if (isCameraBg) {
                viewportCanvas.classList.remove('mode-static-bg');
                if (infiniteBackdrop) {
                    infiniteBackdrop.style.opacity = '1';
                    infiniteBackdrop.style.visibility = 'visible';
                }
                bgModeLabel.innerText = "Fundo: Câmera (Novo)";
            } else {
                viewportCanvas.classList.add('mode-static-bg');
                if (infiniteBackdrop) {
                    infiniteBackdrop.style.opacity = '0';
                    infiniteBackdrop.style.visibility = 'hidden';
                }
                bgModeLabel.innerText = "Fundo: Fixo (Antigo)";
            }
        }

        /* --- MOTOR DE CÂMERA RESPONSIVO (PROPORÇÃO NORMALIZADA DE CORPO) --- */
        const DEFAULT_SCALE = 0.90;
        const MIN_SCALE = 0.55;
        const MAX_SCALE = 4.0;

        let avatarScale = DEFAULT_SCALE;
        let avatarPanX = 0;
        let avatarPanY = 0;
        let isCameraAnimating = false;
        let activeSessionName = "Identidade";

        function getAvatarLayoutMetrics() {
            const w = viewportCanvas ? viewportCanvas.clientWidth : 350;
            const h = viewportCanvas ? viewportCanvas.clientHeight : 600;
            const imgAspect = 9 / 16;
            const containerAspect = w / h;

            let renderedW, renderedH, offsetX, offsetY;

            if (containerAspect < imgAspect) {
                renderedW = w;
                renderedH = w / imgAspect;
                offsetX = 0;
                offsetY = h - renderedH;
            } else {
                renderedH = h;
                renderedW = h * imgAspect;
                offsetX = (w - renderedW) / 2;
                offsetY = 0;
            }

            return { w, h, renderedW, renderedH, offsetX, offsetY };
        }

        const btnDebugMode = document.getElementById('btnDebugMode');
        const cameraHudGroup = document.getElementById('cameraHudGroup');
        const debugCollisionBox = document.getElementById('debugCollisionBox');
        const debugViewportBox = document.getElementById('debugViewportBox');
        const boxBadgeTag = document.getElementById('boxBadgeTag');
        const boxInfoText = document.getElementById('boxInfoText');
        const debugSessionsBar = document.getElementById('debugSessionsBar');

        /* --- MODO DE DEPURAÇÃO E CAIXA DE COLISÃO INTERATIVA --- */
        let isDebugMode = false;

        // Caixas de Colisão Normalizadas (0.0 a 1.0) para cada Sessão
        const sessionBoundingBoxes = {
            "Identidade": { x: 0.05, y: 0.00, w: 0.90, h: 1.00 }, // Corpo Inteiro
            "Aparência":  { x: 0.28, y: 0.00, w: 0.44, h: 0.16 }, // Cabeça e Rosto
            "Busto":      { x: 0.18, y: 0.14, w: 0.64, h: 0.24 }, // Busto e Cintura

        // Sincronização em Nuvem Global: Busca as configurações do servidor ao carregar
        async function fetchGlobalCloudPresets() {

        /* --- CONTROLE DE TRAVAMENTO INDEPENDENTE DOS COLISORES --- */
        let isAvatarBoxLocked = false;

        /* --- MOTOR DE ENQUADRAMENTO BASEADO NA COLISÃO BORDA-A-BORDA COM O CANVAS ÚTIL --- */
        function getSafeViewportBounds(customSheetH = null) {
            const m = getAvatarLayoutMetrics();
            
            // Limite padrão do menu para enquadramento da câmera (~32% da altura da tela)
            const standardMenuLimit = Math.max(120, Math.min(m.h * 0.32, 240));
            const rawSheetH = customSheetH !== null ? customSheetH : ((bottomSheet && bottomSheet.offsetHeight > 0) ? bottomSheet.offsetHeight : 40);
            const effectiveSheetH = Math.min(rawSheetH, standardMenuLimit);
            
            const left = m.w * customViewportCollider.marginLeft;
            const right = m.w * (1 - customViewportCollider.marginRight);
            const top = m.h * customViewportCollider.marginTop;
            const bottom = m.h - effectiveSheetH - (m.h * customViewportCollider.marginBottom);
            
            const width = Math.max(80, right - left);
            const height = Math.max(100, bottom - top);
            const centerY = top + (height / 2);
            const centerX = left + (width / 2);

            return { left, top, width, height, centerX, centerY };
        }

        function renderViewportBoxDOM() {
            if (!debugViewportBox) return;
            const vb = getSafeViewportBounds();
            debugViewportBox.style.left = `${vb.left}px`;
            debugViewportBox.style.top = `${vb.top}px`;
            debugViewportBox.style.width = `${vb.width}px`;
            debugViewportBox.style.height = `${vb.height}px`;

            const vpTag = document.getElementById('viewportBoxTag');
            if (vpTag) {
                const wP = Math.round((vb.width / (viewportCanvas ? viewportCanvas.clientWidth : 350)) * 100);
                const hP = Math.round((vb.height / (viewportCanvas ? viewportCanvas.clientHeight : 600)) * 100);
                vpTag.innerText = `Área Útil do Canvas (${wP}% × ${hP}%)`;
            }
        }

        function calculateFramingFromBoundingBox(box, customSheetH = null) {
            const m = getAvatarLayoutMetrics();
            const vb = getSafeViewportBounds(customSheetH);

            // Largura e altura da caixa de colisão da modelo quando scale = 1.0
            const boxPixelW = Math.max(15, m.renderedW * box.w);
            const boxPixelH = Math.max(15, m.renderedH * box.h);

            // O zoom exato em que a caixa da modelo COLIDE e encosta nas bordas da Área Útil (Colisor Azul):
            const scaleX = vb.width / boxPixelW;
            const scaleY = vb.height / boxPixelH;
            const targetScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.min(scaleX, scaleY)));

            // Centro da caixa de colisão da modelo
            const centerNormX = box.x + (box.w / 2);
            const centerNormY = box.y + (box.h / 2);

            const ptX = m.offsetX + (m.renderedW * centerNormX);
            const ptY = m.offsetY + (m.renderedH * centerNormY);

            // Centraliza a caixa da modelo perfeitamente dentro do centro do Colisor Azul do Canvas
            const targetPanX = (vb.centerX - (m.w / 2)) - (ptX - (m.w / 2)) * targetScale;
            const targetPanY = (vb.centerY - (m.h / 2)) - (ptY - (m.h / 2)) * targetScale;

            const clamped = clampPan(targetPanX, targetPanY, targetScale);

            return {
                scale: targetScale,
                x: clamped.x,
                y: clamped.y
            };
        }

        // Função de atualização contínua e em tempo real da câmera conforme o menu é arrastado
        function updateCameraFramingRealtime(targetDuration = 0, customSheetH = null) {
            const framing = calculateFramingFromBoundingBox(currentBox, customSheetH);
            if (targetDuration > 0) {
                animateAvatarCamera(framing.scale, framing.x, framing.y, targetDuration);
            } else {
                avatarContainer.style.transition = 'none';
                avatarScale = framing.scale;
                avatarPanX = framing.x;
                avatarPanY = framing.y;
                updateAvatarTransform(false);
            }
            renderViewportBoxDOM();
        }

        function renderCollisionBoxDOM() {
            if (!debugCollisionBox) return;
            const m = getAvatarLayoutMetrics();

            const leftPx = m.offsetX + (m.renderedW * currentBox.x);
            const topPx = m.offsetY + (m.renderedH * currentBox.y);
            const widthPx = m.renderedW * currentBox.w;
            const heightPx = m.renderedH * currentBox.h;

            debugCollisionBox.style.left = `${leftPx}px`;
            debugCollisionBox.style.top = `${topPx}px`;
            debugCollisionBox.style.width = `${widthPx}px`;
            debugCollisionBox.style.height = `${heightPx}px`;

            const wPercent = (currentBox.w * 100).toFixed(0);
            const hPercent = (currentBox.h * 100).toFixed(0);
            const xPercent = (currentBox.x * 100).toFixed(0);
            const yPercent = (currentBox.y * 100).toFixed(0);

            if (boxBadgeTag) boxBadgeTag.innerText = `Sessão: ${activeSessionName} (${wPercent}% × ${hPercent}%)`;
            if (boxInfoText) boxInfoText.innerText = `📐 [${activeSessionName}] X:${xPercent}% Y:${yPercent}% | L:${wPercent}% A:${hPercent}%`;

        function updateAvatarTransform(smooth = false) {
            if (smooth) {
                avatarContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
            } else {

        function updateHudDisplay() {

        function animateAvatarCamera(targetScale, targetX, targetY, duration = 480) {
            isCameraAnimating = true;
            avatarContainer.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
            avatarScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, targetScale));

        function applyResponsivePreset(sessionName, duration = 480) {

        /* --- REGISTRAR CAIXA DE COLISÃO DA SESSÃO COM SINCRONIZAÇÃO GLOBAL --- */
        async function registerCurrentBoxPreset() {

        function exportFixedBoxesConfig() {

        /* --- INTERAÇÃO DIRETA: ARRASTAR E REDIMENSIONAR O COLISOR AZUL DA ÁREA ÚTIL --- */
        let vpDragMode = null; // 'move' ou 'nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'
        let vpDragStartMouseX = 0;
        let vpDragStartMouseY = 0;
        let vpDragStartMargins = null;

        if (debugViewportBox) {
            debugViewportBox.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                const handle = e.target.getAttribute('data-vp-handle');
                vpDragMode = handle ? handle : 'move';

                vpDragStartMouseX = e.clientX;
                vpDragStartMouseY = e.clientY;
                vpDragStartMargins = { ...customViewportCollider };

                try { debugViewportBox.setPointerCapture(e.pointerId); } catch(err){}
            });

            debugViewportBox.addEventListener('pointermove', (e) => {
                if (!vpDragMode || !vpDragStartMargins) return;
                const m = getAvatarLayoutMetrics();

                const deltaRatioX = (e.clientX - vpDragStartMouseX) / m.w;
                const deltaRatioY = (e.clientY - vpDragStartMouseY) / m.h;

                if (vpDragMode === 'move') {
                    customViewportCollider.marginLeft = Math.max(0, Math.min(0.40, vpDragStartMargins.marginLeft + deltaRatioX));
                    customViewportCollider.marginRight = Math.max(0, Math.min(0.40, vpDragStartMargins.marginRight - deltaRatioX));
                    customViewportCollider.marginTop = Math.max(0, Math.min(0.40, vpDragStartMargins.marginTop + deltaRatioY));
                    customViewportCollider.marginBottom = Math.max(0, Math.min(0.40, vpDragStartMargins.marginBottom - deltaRatioY));
                } else {
                    if (vpDragMode.includes('w')) {
                        customViewportCollider.marginLeft = Math.max(0, Math.min(0.45, vpDragStartMargins.marginLeft + deltaRatioX));
                    }
                    if (vpDragMode.includes('e')) {
                        customViewportCollider.marginRight = Math.max(0, Math.min(0.45, vpDragStartMargins.marginRight - deltaRatioX));
                    }
                    if (vpDragMode.includes('n')) {
                        customViewportCollider.marginTop = Math.max(0, Math.min(0.45, vpDragStartMargins.marginTop + deltaRatioY));
                    }
                    if (vpDragMode.includes('s')) {
                        customViewportCollider.marginBottom = Math.max(0, Math.min(0.45, vpDragStartMargins.marginBottom - deltaRatioY));
                    }
                }

                try {
                    localStorage.setItem('mytype_viewport_collider', JSON.stringify(customViewportCollider));
                } catch(err){}

                renderViewportBoxDOM();
                updateCameraFramingRealtime(0);
            });

            debugViewportBox.addEventListener('pointerup', (e) => {
                vpDragMode = null;
                vpDragStartMargins = null;
                try { debugViewportBox.releasePointerCapture(e.pointerId); } catch(err){}
            });
        }

        /* --- INTERAÇÃO DIRETA: ARRASTAR E REDIMENSIONAR A CAIXA DE COLISÃO --- */
        let boxDragMode = null; // 'move' ou 'nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'
        let dragStartMouseX = 0;
        let dragStartMouseY = 0;
        let dragStartBox = null;

        if (debugCollisionBox) {
            debugCollisionBox.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                const handle = e.target.getAttribute('data-handle');
                boxDragMode = handle ? handle : 'move';

                dragStartMouseX = e.clientX;
                dragStartMouseY = e.clientY;
                dragStartBox = { ...currentBox };

                try { debugCollisionBox.setPointerCapture(e.pointerId); } catch(err){}
            });

            debugCollisionBox.addEventListener('pointermove', (e) => {
                if (!boxDragMode || !dragStartBox) return;
                const m = getAvatarLayoutMetrics();

                const deltaNormX = (e.clientX - dragStartMouseX) / (m.renderedW * avatarScale);
                const deltaNormY = (e.clientY - dragStartMouseY) / (m.renderedH * avatarScale);

                if (boxDragMode === 'move') {
                    currentBox.x = Math.max(0, Math.min(1 - dragStartBox.w, dragStartBox.x + deltaNormX));
                    currentBox.y = Math.max(0, Math.min(1 - dragStartBox.h, dragStartBox.y + deltaNormY));
                } else {
                    let newX = dragStartBox.x;
                    let newY = dragStartBox.y;
                    let newW = dragStartBox.w;
                    let newH = dragStartBox.h;

                    if (boxDragMode.includes('e')) {
                        newW = Math.max(0.06, Math.min(1 - dragStartBox.x, dragStartBox.w + deltaNormX));
                    }
                    if (boxDragMode.includes('s')) {
                        newH = Math.max(0.06, Math.min(1 - dragStartBox.y, dragStartBox.h + deltaNormY));
                    }
                    if (boxDragMode.includes('w')) {
                        const right = dragStartBox.x + dragStartBox.w;
                        newX = Math.max(0, Math.min(right - 0.06, dragStartBox.x + deltaNormX));
                        newW = right - newX;
                    }
                    if (boxDragMode.includes('n')) {
                        const bottom = dragStartBox.y + dragStartBox.h;
                        newY = Math.max(0, Math.min(bottom - 0.06, dragStartBox.y + deltaNormY));
                        newH = bottom - newY;
                    }

                    currentBox = { x: newX, y: newY, w: newW, h: newH };
                }

                renderCollisionBoxDOM();
            });

            debugCollisionBox.addEventListener('pointerup', (e) => {
                boxDragMode = null;
                dragStartBox = null;
                try { debugCollisionBox.releasePointerCapture(e.pointerId); } catch(err){}
            });
        }

        // Registrar ao clicar no badge HUD
        if (cameraHudBadge) {
            cameraHudBadge.addEventListener('click', (e) => {
                e.stopPropagation();
                registerCurrentBoxPreset();
            });
        }

        /* --- LIMITES RÍGIDOS DE COLISÃO DA AVATAR (BRAÇOS, CABEÇA E PÉS NUNCA PASSAM DA BORDA) --- */
        function getStrictPanBounds(scale = avatarScale) {
            const m = getAvatarLayoutMetrics();
            const w = m.w;
            const h = m.h;

            const scaledW = m.renderedW * scale;
            const scaledH = m.renderedH * scale;

            // Limites laterais permitidos com margem confortável
            let maxX = Math.max(w * 0.40, (scaledW - w) * 0.60 + (w * 0.25));
            let minX = -maxX;

            // Limites verticais (topo da cabeça e pés perfeitamente alcançáveis em qualquer nível de zoom)
            let maxY = Math.max(h * 0.50, (scaledH - h) * 0.70 + (h * 0.45)); // Traz a cabeça para o centro da tela
            let minY = -Math.max(h * 0.50, (scaledH - h) * 0.70 + (h * 0.45)); // Traz os pés para o centro da tela

            if (minX > maxX) [minX, maxX] = [maxX, minX];
            if (minY > maxY) [minY, maxY] = [maxY, minY];

            return { minX, maxX, minY, maxY };
        }

        function clampPan(x, y, scale = avatarScale) {
            const bounds = getStrictPanBounds(scale);
            return {
                x: Math.min(bounds.maxX, Math.max(bounds.minX, x)),
                y: Math.min(bounds.maxY, Math.max(bounds.minY, y))
            };
        }

        /* --- ZOOM COM SCROLL DO MOUSE (FOCO NO CURSOR) --- */
        if (viewportCanvas) {
            viewportCanvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (isCameraAnimating) return;

                const rect = viewportCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;

                const zoomFactor = e.deltaY < 0 ? 1.14 : 0.88;
                const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, avatarScale * zoomFactor));

                if (newScale !== avatarScale) {
                    let nextX = mouseX - (mouseX - avatarPanX) * (newScale / avatarScale);
                    let nextY = mouseY - (mouseY - avatarPanY) * (newScale / avatarScale);
                    avatarScale = newScale;

                    const clamped = clampPan(nextX, nextY);
                    avatarPanX = clamped.x;
                    avatarPanY = clamped.y;
                    updateAvatarTransform(false);
                }
            }, { passive: false });
        }

        /* --- GESTOR UNIFICADO DE TOQUES E PINÇA (POINTER EVENTS ENGINE) --- */
        const activePointers = new Map();
        let lastTapTime = 0;
        let pinchPrevDist = 0;
        let pinchPrevMidX = 0;
        let pinchPrevMidY = 0;

        function getPointersMidpoint() {
            const pts = Array.from(activePointers.values());
            if (pts.length < 2) return null;
            const rect = viewportCanvas.getBoundingClientRect();
            const p1 = pts[0];
            const p2 = pts[1];
            const dist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
            const midX = ((p1.clientX + p2.clientX) / 2) - rect.left - (rect.width / 2);
            const midY = ((p1.clientY + p2.clientY) / 2) - rect.top - (rect.height / 2);
            return { dist, midX, midY };
        }

        if (viewportCanvas) {
            viewportCanvas.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.side-menu') || e.target.closest('.bottom-sheet') || e.target.closest('.footer-nav') || e.target.closest('.camera-hud-group')) return;
                
                // Duplo toque / duplo clique para alternar zoom rápido
                if (activePointers.size === 0) {
                    const now = performance.now();
                    if (now - lastTapTime < 300 && now - lastTapTime > 40) {
                        e.preventDefault();
                        lastTapTime = 0;
                        if (avatarScale > 1.3) {
                            animateAvatarCamera(DEFAULT_SCALE, 0, 0, 380);
                        } else {
                            const rect = viewportCanvas.getBoundingClientRect();
                            const tapX = e.clientX - rect.left - (rect.width / 2);
                            const tapY = e.clientY - rect.top - (rect.height / 2);
                            const clamped = clampPan(-tapX * 0.75, -tapY * 0.75, 2.2);
                            animateAvatarCamera(2.2, clamped.x, clamped.y, 380);
                        }
                        return;
                    }
                    lastTapTime = now;
                }

                activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
                try { viewportCanvas.setPointerCapture(e.pointerId); } catch(err){}

                if (activePointers.size === 2) {
                    const p = getPointersMidpoint();
                    if (p) {
                        pinchPrevDist = p.dist;
                        pinchPrevMidX = p.midX;
                        pinchPrevMidY = p.midY;
                    }
                }
            });

            viewportCanvas.addEventListener('pointermove', (e) => {
                if (!activePointers.has(e.pointerId) || isCameraAnimating) return;

                const prevPtr = activePointers.get(e.pointerId);
                const deltaSingleX = e.clientX - prevPtr.clientX;
                const deltaSingleY = e.clientY - prevPtr.clientY;
                activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

                if (activePointers.size === 1) {
                    // ARRASTE COM 1 DEDO / MOUSE (PANNING 1:1)
                    const nextX = avatarPanX + deltaSingleX;
                    const nextY = avatarPanY + deltaSingleY;
                    const clamped = clampPan(nextX, nextY, avatarScale);
                    avatarPanX = clamped.x;
                    avatarPanY = clamped.y;
                    updateAvatarTransform(false);
                } else if (activePointers.size >= 2) {
                    // PINÇA E ARRASTE SIMULTÂNEO COM 2 DEDOS (PINCH-TO-ZOOM + PAN)
                    const p = getPointersMidpoint();
                    if (p && pinchPrevDist > 0) {
                        const distRatio = p.dist / pinchPrevDist;
                        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, avatarScale * distRatio));

                        // Ponto fixo exato sob os dedos: mantém o ponto sob a pinça 100% ancorado nos dedos
                        let nextX = p.midX - (pinchPrevMidX - avatarPanX) * (newScale / avatarScale);
                        let nextY = p.midY - (pinchPrevMidY - avatarPanY) * (newScale / avatarScale);

                        avatarScale = newScale;
                        const clamped = clampPan(nextX, nextY, avatarScale);
                        avatarPanX = clamped.x;
                        avatarPanY = clamped.y;
                        updateAvatarTransform(false);

                        pinchPrevDist = p.dist;
                        pinchPrevMidX = p.midX;
                        pinchPrevMidY = p.midY;
                    }
                }
            });

                if (activePointers.has(e.pointerId)) {
                    activePointers.delete(e.pointerId);
                    try { viewportCanvas.releasePointerCapture(e.pointerId); } catch(err){}
                }

                if (activePointers.size === 1) {
                    // Ao soltar 1 dos dedos, re-ancora o dedo restante para transição suave sem saltos
                    const remainingEntry = Array.from(activePointers.entries())[0];
                    if (remainingEntry) {
                        activePointers.set(remainingEntry[0], {
                            clientX: remainingEntry[1].clientX,
                            clientY: remainingEntry[1].clientY
                        });
                    }
                    pinchPrevDist = 0;
                } else if (activePointers.size === 0) {
                    pinchPrevDist = 0;
                }
            }

            viewportCanvas.addEventListener('pointerup', handlePointerUpOrCancel);
            viewportCanvas.addEventListener('pointercancel', handlePointerUpOrCancel);
        }

            windowDragHandle.addEventListener('pointerup', (e) => {
                if (!isPhoneDragging) return;
                isPhoneDragging = false;
                try { windowDragHandle.releasePointerCapture(e.pointerId); } catch(err) {}
                snapPhoneToBoundaries();
            });

            windowDragHandle.addEventListener('pointercancel', (e) => {
                if (!isPhoneDragging) return;

                snapPhoneToBoundaries();
            });
        }

        function snapPhoneToBoundaries() {
            if (window.innerWidth <= 500) return;

            const rect = appContainer.getBoundingClientRect();
            const pad = 16;
            let deltaX = 0;
            let deltaY = 0;

            if (rect.left < pad + 20) { 
                deltaX = (pad + 20) - rect.left;
            } else if (rect.right > window.innerWidth - pad - 20) { 
                deltaX = (window.innerWidth - pad - 20) - rect.right;
            }

            if (rect.top < pad + 20) {
                deltaY = (pad + 20) - rect.top;
            } else if (rect.bottom > window.innerHeight - pad) {
                deltaY = (window.innerHeight - pad) - rect.bottom;
            }

            if (deltaX !== 0 || deltaY !== 0) {
                phonePosX += deltaX;
                phonePosY += deltaY;
                phoneMovableFrame.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                phoneMovableFrame.style.transform = `translate(${phonePosX}px, ${phonePosY}px)`;
            }
        }

            if (!isDraggingSheet) return;
            const diff = sheetStartY - e.clientY;
            if (Math.abs(diff) > 3) sheetHasMoved = true;
            
            const now = performance.now();
            const dt = now - lastMoveTime;
            if (dt > 8) {
                // Velocidade instantânea do movimento (positivo = subindo, negativo = descendo)
                sheetVelocityY = (lastMoveY - e.clientY) / dt;
                lastMoveY = e.clientY;
                lastMoveTime = now;
            }

            let newHeight = sheetStartHeight + diff;
            const max = getMaxHeight();
            if (newHeight < minHeight) newHeight = minHeight;
            if (newHeight > max) newHeight = max;

            bottomSheet.style.height = newHeight + 'px';
            updateSheetState(newHeight);

            updateCameraFramingRealtime(0, newHeight);

            if (!isDraggingSheet) return;

            sheetHandle.classList.remove('active-pink'); 
            try { sheetHeader.releasePointerCapture(e.pointerId); } catch(err){}

            const totalTime = performance.now() - sheetStartTime;
            const totalDiff = sheetStartY - e.clientY;
            let targetH;

            // Detecção de Swipe Rápido / Flick (arrastar bem rápido com o dedo ou mouse)
            const isFastFlickUp = sheetVelocityY > 0.45 || (totalDiff > 45 && totalTime < 240);

            if (isFastFlickUp) {

            "#1a1a1a": "none",
            "#3b2b22": "sepia(0.5) brightness(0.85) hue-rotate(330deg)",
            "#6b442b": "sepia(0.6) brightness(1.1) saturate(1.5) hue-rotate(345deg)",
            "#a87d4a": "sepia(0.7) brightness(1.25) saturate(1.8) hue-rotate(15deg)",
            "#e6c594": "sepia(0.5) brightness(1.45) saturate(1.4) hue-rotate(30deg)",
            "#c93b3b": "sepia(0.8) brightness(0.95) saturate(3.2) hue-rotate(310deg)",
            "#3b7dc9": "hue-rotate(185deg) saturate(2.5) brightness(0.95)",
            "#ffffff": "grayscale(1) brightness(1.6) contrast(1.1)"
        };

        function applyHairStyle(styleName) {
            avatarState.hairStyle = styleName;
            if (styleName === "Curto") {
                layerHair.src = "assets/hair_blonde_bob.png";
                layerHair.classList.remove('hidden');
            } else if (styleName === "Cacheado" || styleName === "Ondulado" || styleName === "Afro") {
                layerHair.src = "assets/hair_curly_dark.png";
                layerHair.classList.remove('hidden');
            } else {
                // Liso longo original da base
                layerHair.classList.add('hidden');
            }
            applyHairColor(avatarState.hairColor);
        }

        function applyHairColor(hexColor) {
            avatarState.hairColor = hexColor;
            const filterValue = hairColorFilters[hexColor] || "none";
            layerHair.style.filter = filterValue;
        }

        function applyOutfit(outfitName) {
            avatarState.outfit = outfitName;
            if (outfitName === "Casual" || outfitName === "Esportivo" || outfitName === "Social") {
                layerOutfit.src = "assets/outfit_casual.png";
                layerOutfit.classList.remove('hidden');
            } else if (outfitName === "Lingerie" || outfitName === "Biquíni" || outfitName === "Base") {
                layerOutfit.classList.add('hidden');
            }
        }

        function loadTabContent(tabName) {
            const data = tabData[tabName];
            if (!data) return;

            sideMenu.innerHTML = '';
            data.sideButtons.forEach((btnData, index) => {
                const button = document.createElement('button');
                button.className = `side-item ${index === 0 ? 'active' : ''}`;
                button.onclick = function() { 
                    selectSideOption(this); 
                };
                button.innerHTML = `
                    <div class="side-icon-wrapper"><svg viewBox="0 0 24 24">${btnData.icon}</svg></div>
                    ${btnData.label}
                `;
                sideMenu.appendChild(button);
            });

            sheetContent.innerHTML = data.sheetHTML;

            // Anima a câmera para o preset responsivo correspondente da aba
            applyResponsivePreset(tabName, 480);

            setTimeout(() => {
                enableHorizontalDrag('stylesScroll');
                enableHorizontalDrag('colorsScroll');
                enableHorizontalDrag('bustoScroll');
                enableHorizontalDrag('pernasScroll');
                enableHorizontalDrag('pesScroll');
                enableHorizontalDrag('estiloScroll');
                enableHorizontalDrag('gravacaoScroll');
            }, 50);
        }

        function selectSideOption(el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function selectStyle(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const label = el.querySelector('span') ? el.querySelector('span').innerText.trim() : '';

            if (parent.id === 'stylesScroll') {
                applyHairStyle(label);
            } else if (parent.id === 'estiloScroll') {
                applyOutfit(label);
            } else if (parent.id === 'pesScroll') {
                if (label === 'Descalço') {
                    layerOutfit.classList.add('hidden');
                } else {
                    layerOutfit.classList.remove('hidden');
                }
            }
        }

        function selectColor(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            const hex = el.getAttribute('data-color') || el.style.backgroundColor;
            if (parent.id === 'colorsScroll') {
                applyHairColor(hex);
            }
        }

        function selectFooterTab(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const tabName = el.getAttribute('data-tab');
            loadTabContent(tabName);
        }

        // Recalcula o enquadramento responsivo em rotação ou redimensionamento de janela
        window.addEventListener('resize', () => {
            if (activeSessionName) {
                applyResponsivePreset(activeSessionName, 0);
            }
            renderSheetLimitLine();
        });

        // Inicia carregando a aba "Identidade" e com as configurações fechadas
        loadTabContent("Identidade");
        renderSheetLimitLine();
    </script>
</body>
</html>
