<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customizador de Avatar Dinâmico</title>
    <!-- Google Firebase App & Firestore SDKs (Tempo Real Global) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #0c0b0e;
            --bg-container: #1a181f;
            --bg-sheet: #14141b;
            --bg-card: #27242b;
            --bg-pill: #1b1b21;
            --primary: #c96b7c;
            --text-main: #ffffff;
            --text-secondary: #8c8891;
            --text-muted: #b0acb8;
            --border-color: #26242f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .phone-movable-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        .app-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Desktop: Janela Móvel e Botões Circulares Sobrepostos nas Quinas */
        @media (min-width: 501px) {
            body {
                background: radial-gradient(circle at center, #1b1922 0%, #0c0b0e 100%);
            }

            .phone-wrapper {
                padding: 20px;
            }

            .app-container {
                aspect-ratio: 9 / 19.5;
                height: min(94vh, calc(100vh - 28px));
                width: auto;
                max-width: calc(min(94vh, calc(100vh - 28px)) * (9 / 19.5));
                max-height: 94vh;
                border-radius: 38px;
                border: 2px solid var(--border-color);
                box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
                position: relative;
            }

            /* Barra de Título Superior Estilo Janela OS (Apenas Computador) */
            .desktop-titlebar {
                width: 100%;
                height: 38px;
                background: rgba(22, 19, 28, 0.95);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-bottom: 1px solid var(--border-color);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px 0 18px;
                z-index: 80;
                cursor: grab;
                user-select: none;
                flex-shrink: 0;
                border-top-left-radius: 36px;
                border-top-right-radius: 36px;
                touch-action: none;
            }

            .desktop-titlebar:active {
                cursor: grabbing;
            }

            .titlebar-left {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .titlebar-title {
                font-size: 11px;
                font-weight: 600;
                color: var(--text-muted);
                letter-spacing: 0.4px;
                pointer-events: none;
            }

            .titlebar-right {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-right: 4px;
            }

            .titlebar-action-btn {
                width: 26px;
                height: 26px;
                border-radius: 7px;
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.14);
                color: #d1cdd9;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .titlebar-action-btn:hover {
                background: rgba(255, 255, 255, 0.16);
                color: #ffffff;
                transform: scale(1.06);
            }

            .titlebar-action-btn:active {
                transform: scale(0.92);
            }

            .titlebar-action-btn svg {
                width: 14px;
                height: 14px;
                fill: currentColor;
                pointer-events: none;
            }

            /* Alças Interativas de Redimensionamento da Janela (Estilo Windows OS no Computador) */
            .win-resize-handle {
                position: absolute;
                z-index: 120;
                touch-action: none;
            }

            .win-resize-n  { top: -12px; left: 32px; right: 32px; height: 24px; cursor: ns-resize; }
            .win-resize-s  { bottom: -12px; left: 32px; right: 32px; height: 24px; cursor: ns-resize; }
            .win-resize-w  { left: -12px; top: 32px; bottom: 32px; width: 24px; cursor: ew-resize; }
            .win-resize-e  { right: -12px; top: 32px; bottom: 32px; width: 24px; cursor: ew-resize; }
            .win-resize-nw { top: -12px; left: -12px; width: 44px; height: 44px; cursor: nwse-resize; z-index: 130; }
            .win-resize-ne { top: -12px; right: -12px; width: 44px; height: 44px; cursor: nesw-resize; z-index: 130; }
            .win-resize-sw { bottom: -12px; left: -12px; width: 44px; height: 44px; cursor: nesw-resize; z-index: 130; }
            .win-resize-se { bottom: -12px; right: -12px; width: 44px; height: 44px; cursor: nwse-resize; z-index: 130; }
        }

        @media (max-width: 500px) {
            .desktop-titlebar {
                display: none !important;
            }
        }



        /* Celularzinho em miniatura suspenso quando minimizado */
        .floating-mini-phone {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px;
            height: 96px;
            border-radius: 16px;
            background-color: #121118;
            border: 2px solid var(--primary);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(201, 107, 124, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.3) rotate(-15deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, box-shadow 0.2s;
            padding: 3px;
        }

        .floating-mini-phone.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) rotate(0deg);
            animation: miniPhoneFloat 3.5s ease-in-out infinite alternate;
        }

        .floating-mini-phone:hover {
            transform: scale(1.15) rotate(4deg) !important;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 35px rgba(201, 107, 124, 0.7);
            border-color: #ffffff;
        }

        .mini-phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--bg-container);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-phone-notch {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            z-index: 5;
        }

        .mini-phone-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            pointer-events: none;
        }

        .mini-phone-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #25d366;
            border: 1.5px solid var(--bg-container);
            box-shadow: 0 0 6px rgba(37, 211, 102, 0.9);
            z-index: 6;
        }

        .mini-phone-bar {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            z-index: 5;
        }

        @keyframes miniPhoneFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Viewport / Canvas Interativo (Padrão Desktop: Compacto e Elegante) */
        .viewport {
            position: absolute;
            top: 28px;
            left: 0;
            width: 100%;
            bottom: 84px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #17151b;
            overflow: hidden;
            z-index: 1;
            cursor: grab;
            touch-action: none;
            transition: background 0.3s ease, top 0.2s ease;
        }

        .viewport:active {
            cursor: grabbing;
        }

        /* Modo Fundo Antigo / Fixo */
        .viewport.mode-static-bg {
            background: radial-gradient(circle at center, #382e3f 0%, #17151b 75%) !important;
        }

        .viewport.mode-static-bg .infinite-gradient-backdrop {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            pointer-events: none;
            will-change: transform;
        }

        /* Clone exato do degradê 10x maior que se move junto com o avatar (Modo Câmera) */
        .infinite-gradient-backdrop {
            position: absolute;
            top: -450%;
            left: -450%;
            width: 1000%;
            height: 1000%;
            background: radial-gradient(circle at 50% 50%, #382e3f 0%, #17151b 7.5%, #17151b 100%);
            pointer-events: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .avatar-layer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            position: absolute;
            bottom: 0;
            left: 0;
            pointer-events: none;
            image-rendering: auto;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: opacity 0.25s ease, filter 0.3s ease;
        }

        .avatar-layer.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .avatar-base {
            z-index: 1;
        }

        #layerOutfit {
            z-index: 2;
        }

        #layerHair {
            z-index: 3;
        }

        /* Painel de Depuração Flutuante Externo (Apenas Computador - Fora do Canvas) */
        .desktop-debug-wrapper {
            position: fixed;
            top: 18px;
            left: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 99999;
            align-items: flex-start;
        }

        .desktop-debug-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #232029;
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
            padding: 0;
        }

        .desktop-debug-btn:hover {
            background-color: #382c33;
            border-color: #10b981;
            color: #10b981;
            transform: scale(1.12);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
        }

        .desktop-debug-btn.active {
            background-color: #10b981;
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8), 0 6px 18px rgba(0, 0, 0, 0.75);
            transform: scale(1.08);
        }

        .desktop-debug-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            pointer-events: none;
            display: block;
        }

        /* HUD e Painel de Depuração Externo */
        .camera-hud-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: 280px;
        }

        .camera-hud-group.debug-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .camera-hud-badge {
            background: rgba(20, 18, 26, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        .camera-hud-badge:hover {
            background: rgba(35, 30, 42, 0.95);
            border-color: var(--primary);
            transform: scale(1.01);
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .hud-row svg {
            width: 11px;
            height: 11px;
            fill: var(--primary);
        }

        .hud-sub {
            font-size: 8.5px;
            color: var(--text-muted);
            font-family: monospace, sans-serif;
            letter-spacing: -0.2px;
        }

        /* Botões de Ação do PIN */
        .pin-actions-row {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .pin-action-btn {
            background: rgba(26, 24, 34, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 8.5px;
            font-weight: 600;
            padding: 4px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .pin-action-btn:hover {
            background: var(--primary);
            border-color: #ffffff;
            transform: scale(1.03);
        }

        /* Botão para alternar entre Degradê Antigo (Fixo) e Degradê Novo (Câmera) */
        .bg-mode-btn {
            background: rgba(20, 18, 26, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 5px 9px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #ffffff;
            font-size: 9px;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            width: fit-content;
        }

        .bg-mode-btn:hover {
            background: rgba(35, 30, 42, 0.95);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .bg-mode-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--primary);
            flex-shrink: 0;
        }

        /* Barra de Sessões para Navegação Rápida */
        .debug-sessions-bar {
            background: rgba(20, 18, 26, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 5px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            max-width: 280px;
        }

        .debug-session-tag {
            font-size: 8.5px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #d1cdd9;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .debug-session-tag:hover,
        .debug-session-tag.active {
            background: var(--primary);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.04);
        }

        /* Caixa de Colisão / Bounding Box de Enquadramento */
        .debug-collision-box {
            position: absolute;
            border: 2px solid var(--primary);
            background: rgba(201, 107, 124, 0.18);
            box-shadow: 0 0 18px rgba(201, 107, 124, 0.45), inset 0 0 16px rgba(201, 107, 124, 0.2);
            z-index: 60;
            cursor: move;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            touch-action: none;
            box-sizing: border-box;
        }

        .debug-collision-box.debug-visible {
            opacity: 1;
            visibility: visible;
        }

        .viewport-box-tag {
            position: absolute;
            top: 4px;
            left: 6px;
            background: rgba(12, 11, 14, 0.94);
            color: #38bdf8;
            font-size: 8px;
            font-weight: 700;
            font-family: monospace;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #38bdf8;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* Alças de Redimensionamento do Colisor Azul */
        .vp-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border: 2px solid #38bdf8;
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            z-index: 55;
            box-sizing: border-box;
        }

        .vp-handle.vp-handle-nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .vp-handle.vp-handle-ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .vp-handle.vp-handle-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .vp-handle.vp-handle-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .vp-handle.vp-handle-n  { top: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .vp-handle.vp-handle-s  { bottom: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .vp-handle.vp-handle-w  { left: -5px; top: calc(50% - 5px); cursor: ew-resize; }
        .vp-handle.vp-handle-e  { right: -5px; top: calc(50% - 5px); cursor: ew-resize; }

        /* Botões de Trava e Edição dos Colisores */
        .lock-toggles-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .btn-lock-toggle {
            flex: 1;
            font-size: 8.5px;
            font-weight: 700;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(25, 22, 32, 0.95);
            color: #d1cdd9;
            white-space: nowrap;
            user-select: none;
        }

        .btn-lock-toggle.btn-avatar-lock.unlocked {
            background: rgba(201, 107, 124, 0.28);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(201, 107, 124, 0.5);
        }

        .btn-lock-toggle.btn-viewport-lock.unlocked {
            background: rgba(56, 189, 248, 0.28);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .btn-lock-toggle.btn-green-lock.unlocked {
            background: rgba(16, 185, 129, 0.28);
            border-color: #10b981;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .btn-lock-toggle.is-locked {
            opacity: 0.65;
            background: rgba(18, 16, 22, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
            color: #8c8899;
        }

        /* Alças de Redimensionamento Invisíveis da Janela OS no Desktop */
        .win-resize-handle {
            position: absolute;
            z-index: 999;
            background: transparent;
            opacity: 0;
            pointer-events: auto;
        }
        .win-resize-handle.win-resize-n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
        .win-resize-handle.win-resize-s  { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
        .win-resize-handle.win-resize-w  { left: -4px; top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; }
        .win-resize-handle.win-resize-e  { right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; }
        .win-resize-handle.win-resize-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
        .win-resize-handle.win-resize-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-handle.win-resize-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-handle.win-resize-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

        /* --- CAIXA DE ENQUADRAMENTO UNIVERSAL (BOUNDING BOX) --- */
        .debug-box-frame {
            position: absolute;
            border: 2px dashed #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
            z-index: 70;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            box-sizing: border-box;
        }

        .debug-box-frame.debug-visible {
            opacity: 1;
            visibility: visible;
        }

        .debug-box-badge {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 24, 18, 0.96);
            color: #10b981;
            font-size: 8.5px;
            font-weight: 700;
            font-family: monospace;
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid #10b981;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .dbg-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 2px solid #10b981;
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            z-index: 75;
            box-sizing: border-box;
            pointer-events: auto;
            touch-action: none;
        }
        .dbg-handle.handle-nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .dbg-handle.handle-ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .dbg-handle.handle-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .dbg-handle.handle-se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .dbg-handle.handle-n  { top: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .dbg-handle.handle-s  { bottom: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .dbg-handle.handle-w  { left: -6px; top: calc(50% - 6px); cursor: ew-resize; }
        .dbg-handle.handle-e  { right: -6px; top: calc(50% - 6px); cursor: ew-resize; }

        /* Seção Exclusiva de Enquadramento no Menu HUD */
        
        /* Controles Interativos de Âncora da Câmera */
        .camera-anchor-controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(12, 10, 16, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 8px;
        }
        .anchor-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .anchor-label {
            font-size: 9.5px;
            font-weight: 700;
            color: #10b981;
            font-family: monospace;
        }
        .anchor-btn-group {
            display: flex;
            gap: 3px;
        }
        .anchor-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #d1cdd9;
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .anchor-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }
        .anchor-btn.active {
            background: #10b981 !important;
            border-color: #10b981 !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }


        /* Badge de Status de Conexão com o Servidor / Firebase */
        .server-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 24, 18, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 9.5px;
            font-weight: 700;
            font-family: monospace;
            color: #10b981;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .server-status-badge.sending {
            background: rgba(35, 25, 10, 0.95) !important;
            border-color: #f59e0b !important;
            color: #fbbf24 !important;
        }
        .server-status-badge.error {
            background: rgba(35, 12, 16, 0.95) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }
        .status-dot-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: statusPulse 1.8s infinite ease-in-out;
            flex-shrink: 0;
        }
        .server-status-badge.sending .status-dot-pulse {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }
        .server-status-badge.error .status-dot-pulse {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            animation: none;
        }
        @keyframes statusPulse {
            0% { transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.7; }
        }

.green-dedicated-section {
            background: rgba(16, 28, 22, 0.94);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 12px rgba(16, 185, 129, 0.2);
            max-width: 280px;
        }

        .green-section-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .green-dot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .green-section-title {
            font-size: 9.5px;
            font-weight: 700;
            color: #10b981;
            letter-spacing: 0.2px;
        }

        .btn-green-action {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
            color: #10b981;
        }
        .btn-green-action:hover {
            background: #10b981;
            color: #ffffff;
        }

        .btn-green-save {
            background: rgba(16, 185, 129, 0.3);
            border-color: #10b981;
            color: #ffffff;
            font-weight: 700;
        }
        .btn-green-save:hover {
            background: #059669;
            transform: scale(1.04);
        }

        .btn-green-export {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .btn-green-export:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .green-tag:hover,
        .green-tag.active {
            background: #10b981 !important;
            color: #ffffff !important;
            border-color: #34d399 !important;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        .bg-mode-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--primary);
            flex-shrink: 0;
        }

        .side-menu {
            position: absolute;
            right: 10px;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 25;
            max-height: calc(100% - 140px);
            overflow-y: auto;
            scrollbar-width: none;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
            transition: top 0.2s ease;
        }

        .side-menu::-webkit-scrollbar {
            display: none;
        }

        .side-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 9.5px;
            cursor: pointer;
            gap: 2px;
            transition: color 0.2s;
        }

        .side-item.active {
            color: var(--primary);
        }

        .side-icon-wrapper {
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-icon-wrapper svg {
            width: 21px;
            height: 21px;
            fill: currentColor;
        }

        /* Barra Inferior Flutuante */
        .footer-nav {
            position: absolute;
            bottom: 14px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 5px;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 7.5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            z-index: 40;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .footer-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            font-size: 9.5px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            flex: 0 0 calc((100% - (4 * 5px)) / 5);
            min-width: 48px;
            white-space: nowrap;
        }

        @media (max-width: 360px) {
            .nav-item {
                flex: 0 0 54px;
            }
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon-wrapper {
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon-wrapper svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Aba Deslizante de Configurações (Estende até a base como plano de fundo) */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-sheet);
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
            padding: 0 14px 14px 14px;
            z-index: 30;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Linha Fina Cinza Delicada de Ponta a Ponta */
        .sheet-drag-limit-line {
            position: absolute;
            left: 0;
            right: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.10) 15%, rgba(255, 255, 255, 0.10) 85%, rgba(255, 255, 255, 0.02));
            pointer-events: none;
            z-index: 29;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .sheet-header-area {
            width: 100%;
            cursor: pointer;
            padding: 4px 0 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
            touch-action: none;
            position: relative;
            z-index: 35;
        }

        .sheet-handle {
            width: 45px;
            height: 6px;
            background-color: #5c5765;
            border-radius: 12px;
            margin-top: 4px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .sheet-header-area:active .sheet-handle,
        .sheet-handle.active-pink {
            background-color: var(--primary);
            transform: scale(1.05);
        }

        .sheet-title {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            position: static;
            transform: translateY(0);
            margin: 0;
            opacity: 1;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .sheet-title.is-hidden {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
        }

        .sheet-content {
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            margin-top: -6px;
            margin-bottom: 64px;
            padding-bottom: 14px;
            opacity: 1;
            transition: opacity 0.15s ease;
            -webkit-overflow-scrolling: touch;
        }

        .sheet-content::-webkit-scrollbar {
            display: none;
        }

        .sheet-content > * {
            flex-shrink: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .section-divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .styles-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .styles-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .style-card {
            background-color: var(--bg-card); 
            border: 2px solid transparent;
            border-radius: 16px;
            min-width: 82px;
            height: 92px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transition: border-color 0.2s, transform 0.2s;
        }

        .style-card.active {
            border-color: var(--primary);
        }

        .style-card span {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            pointer-events: none;
        }

        .colors-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            scrollbar-width: none;
            width: 100%;
            cursor: pointer;
            -webkit-overflow-scrolling: touch;
        }

        .colors-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .color-dot {
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .color-dot.active {
            border-color: var(--primary);
            padding: 2px;
        }

        /* --- REGRAS DEDICADAS PARA DISPOSITIVOS MÓVEIS (CELULAR REAL TOUCH) --- */
        @media (max-width: 500px) {
            .phone-wrapper,
            .phone-movable-frame {
                width: 100%;
                height: 100%;
                padding: 0;
                transform: none !important;
            }

            .app-container {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .window-btn-drag,
            .window-btn-minimize,
            .floating-mini-phone,
            .desktop-debug-wrapper {
                display: none !important;
            }

            /* Barra inferior flutuante calibrada no celular (-5% vertical) */
            .footer-nav {
                bottom: max(16px, env(safe-area-inset-bottom, 16px)) !important;
                padding: 11px 12px !important;
                border-radius: 18px !important;
                gap: 6px !important;
            }

            .nav-item {
                font-size: 11.5px !important;
                gap: 4px !important;
                min-width: 58px !important;
                font-weight: 600 !important;
            }

            .nav-icon-wrapper {
                width: 28px !important;
                height: 28px !important;
            }

            .nav-icon-wrapper svg {
                width: 23px !important;
                height: 23px !important;
            }

            /* Puxador colado no topo do limite da aba com nome no meio */
            .sheet-handle {
                width: 52px !important;
                height: 7px !important;
                border-radius: 14px !important;
                margin-top: 5px !important;
            }

            .sheet-header-area {
                padding: 3px 0 10px 0 !important;
                gap: 8px !important;
            }

            .sheet-title {
                font-size: 12px !important;
                margin: 0 !important;
            }

            /* Linha de corte da visualização exatamente na parte de cima do retângulo */
            .sheet-content {
                margin-top: -6px !important;
                margin-bottom: calc(max(16px, env(safe-area-inset-bottom, 16px)) + 58px) !important;
                padding-bottom: 14px !important;
                gap: 14px !important;
            }

            .style-card {
                min-width: 86px !important;
                height: 96px !important;
                border-radius: 18px !important;
            }

            .style-card span {
                font-size: 12px !important;
            }

            .color-dot {
                min-width: 40px !important;
                height: 40px !important;
            }

            .section-title {
                font-size: 15px !important;
            }

            /* Menu e ícones laterais +15% maiores no celular */
            .side-menu {
                right: 14px !important;
                gap: 12px !important;
            }

            .side-item {
                font-size: 11.5px !important;
                gap: 3px !important;
                font-weight: 600 !important;
            }

            .side-icon-wrapper {
                width: 44px !important;
                height: 44px !important;
            }

            .side-icon-wrapper svg {
                width: 28px !important;
                height: 28px !important;
            }

            .desktop-debug-wrapper {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Painel de Gravação e Depuração de Câmera (Desktop) -->
    <div class="desktop-debug-wrapper" id="desktopDebugWrapper">
        <button class="desktop-debug-btn" id="btnDebugMode" title="Painel de Câmera e Gravação" aria-label="Câmera" onclick="toggleDebugMode(event)">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#ffffff" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8-9h-3.17l-1.83-2H9L7.17 6H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H4V8h4.05l1.83-2h4.24l1.83 2H20v12z"/></svg>
        </button>

        <div class="camera-hud-group" id="cameraHudGroup">
            <div class="green-dedicated-section" id="cameraControlSection">
                <div class="green-section-header">
                    <span class="green-dot-indicator"></span>
                    <span class="green-section-title">Controle de Câmera por Sessão</span>
                
                    <div class="server-status-badge" id="serverStatusBadge" title="Status de Sincronização em Tempo Real">
                        <span class="status-dot-pulse" id="statusDotPulse"></span>
                        <span id="serverStatusText">🟢 Conectando...</span>
                    </div></div>
                
                <div class="camera-hud-badge" id="cameraHudBadge">
                    <div class="hud-row">
                        <span id="activeSessionTitle" style="color: #10b981; font-weight: 700;">🎯 Sessão: Identidade</span>
                    </div>
                <!-- Controles de Âncora Vertical e Horizontal -->
                <div class="camera-anchor-controls" id="cameraAnchorControls">
                    <div class="anchor-control-row">
                        <span class="anchor-label">⚓ Vertical:</span>
                        <div class="anchor-btn-group">
                            <button class="anchor-btn" data-anchor-v="top" onclick="setSessionAnchorV('top')" title="Fixar no Topo (ajusta para baixo)">⬆️ Topo</button>
                            <button class="anchor-btn active" data-anchor-v="center" onclick="setSessionAnchorV('center')" title="Centro Vertical">⏺️ Centro</button>
                            <button class="anchor-btn" data-anchor-v="bottom" onclick="setSessionAnchorV('bottom')" title="Fixar na Base (ajusta para cima)">⬇️ Base</button>
                        </div>
                    </div>
                    <div class="anchor-control-row">
                        <span class="anchor-label">⚓ Horizontal:</span>
                        <div class="anchor-btn-group">
                            <button class="anchor-btn" data-anchor-h="left" onclick="setSessionAnchorH('left')" title="Fixar na Esquerda">⬅️ Esq</button>
                            <button class="anchor-btn active" data-anchor-h="center" onclick="setSessionAnchorH('center')" title="Centro Horizontal">⏺️ Centro</button>
                            <button class="anchor-btn" data-anchor-h="right" onclick="setSessionAnchorH('right')" title="Fixar na Direita">➡️ Dir</button>
                        </div>
                    </div>
                </div>

                    <div class="hud-sub" id="liveCameraStatus" style="font-family: monospace; font-size: 11px;">🔍 Zoom: 90% | ↔️ X: 0px | ↕️ Y: 0px</div>
                </div>

                <div class="pin-actions-row">
                    <button class="pin-action-btn btn-green-save" id="btnSaveCamera" onclick="saveCurrentCameraToSession()" title="Grava o Zoom e a Posição atuais para esta sessão">
                        💾 Gravar Câmera
                    </button>
                    <button class="pin-action-btn btn-green-action" onclick="applySessionCameraPreset(activeSessionName)" title="Testa a posição gravada para a sessão ativa">
                        🎯 Testar
                    </button>
                    <button class="pin-action-btn" onclick="resetCameraToDefault()" title="Reseta para a visão padrão 100% de corpo inteiro">
                        🔄 Padrão
                    </button>
                    <button class="pin-action-btn btn-green-export" id="btnExportCamera" onclick="exportCameraPresets()" title="Copia o JSON com todas as 7 posições de câmera">
                        📋 Exportar
                    </button>
                </div>

                <div class="debug-sessions-bar green-sessions-bar" id="cameraSessionsBar">
                    <span class="debug-session-tag green-tag active" data-camera-tab="Identidade" onclick="selectCameraSession('Identidade')">Identidade</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Aparência" onclick="selectCameraSession('Aparência')">Aparência</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Busto" onclick="selectCameraSession('Busto')">Busto</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Pernas" onclick="selectCameraSession('Pernas')">Pernas</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Pés" onclick="selectCameraSession('Pés')">Pés</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Estilo" onclick="selectCameraSession('Estilo')">Estilo</span>
                    <span class="debug-session-tag green-tag" data-camera-tab="Gravação" onclick="selectCameraSession('Gravação')">Gravação</span>
                </div>
            </div>

            <!-- Botão para alternar entre degradê antigo e novo -->
            <button class="bg-mode-btn" id="bgToggleBtn" title="Clique para alternar o estilo do fundo" onclick="toggleBackgroundMode()">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20V4Z"/></svg>
                <span id="bgModeLabel">Fundo: Câmera (Novo)</span>
            </button>
        </div>
    </div>

    <div class="phone-wrapper" id="phoneWrapper">
        <div class="phone-movable-frame" id="phoneMovableFrame">
            
            <!-- Alças Interativas de Redimensionamento Livre da Janela (Estilo Windows OS no Computador) -->
            <div class="win-resize-handle win-resize-n" data-resize="n" title="Arraste para redimensionar verticalmente"></div>
            <div class="win-resize-handle win-resize-s" data-resize="s" title="Arraste para redimensionar verticalmente"></div>
            <div class="win-resize-handle win-resize-w" data-resize="w" title="Arraste para redimensionar horizontalmente"></div>
            <div class="win-resize-handle win-resize-e" data-resize="e" title="Arraste para redimensionar horizontalmente"></div>
            <div class="win-resize-handle win-resize-nw" data-resize="nw" title="Arraste para redimensionar"></div>
            <div class="win-resize-handle win-resize-ne" data-resize="ne" title="Arraste para redimensionar"></div>
            <div class="win-resize-handle win-resize-sw" data-resize="sw" title="Arraste para redimensionar"></div>
            <div class="win-resize-handle win-resize-se" data-resize="se" title="Arraste para redimensionar"></div>

            <div class="app-container" id="appContainer">
                
                <!-- Barra de Título Superior Estilo Janela OS (Desktop) -->
                <div class="desktop-titlebar" id="desktopTitlebar" title="Clique e arraste para movimentar a janela">
                    <div class="titlebar-left">
                        <span class="titlebar-title">MyType Studio</span>

            <div class="mini-phone-notch"></div>

            <div class="mini-phone-badge"></div>
            <div class="mini-phone-bar"></div>
